# A made-up enclosure's back panel, dimensioned on an A3 sheet: its overall
# size, a fan cut-out and a gland plate cut-out, a slot with round ends, a
# chamfered corner, four mounting holes and two gland holes. Linear,
# aligned, radius and diameter dimensions in ISO-25, the metric sheet's
# own style, and in two styles of the sheet's: one with open arrowheads and
# a suffix, one with text centred and horizontal, as Standard draws it.
# Everything here is made up.
units: mm
paper: ISO A3 landscape
layers:
  border: {color: white, lineweight: 0.5}
  panel: {color: white, lineweight: 0.35}
  holes: {color: white, lineweight: 0.25}
  dims: {color: green}
  notes: {color: yellow}
dimension_styles:
  cutout:
    arrowhead: open
    arrow_size: 3
    text_height: 3
    suffix: ' mm'
  reference:
    placement: centered
    precision: 1
    suppress_trailing_zeros: true
    decimal_separator: period
objects:
  - polyline: {points: [[0, 0, 0], [420, 0, 0], [420, 297, 0], [0, 297, 0]], closed: true, layer: border}
  # The back panel, 300 by 200, its top right corner chamfered 20 at 45°.
  - polyline:
      id: panel
      points: [[60, 50, 0], [360, 50, 0], [360, 230, 0], [340, 250, 0], [60, 250, 0]]
      closed: true
      layer: panel
  # The fan cut-out and the gland plate cut-out.
  - polyline: {id: fan, points: [[90, 120, 0], [210, 120, 0], [210, 200, 0], [90, 200, 0]], closed: true, layer: panel}
  - polyline: {id: gland-plate, points: [[250, 80, 0], [330, 80, 0], [330, 120, 0], [250, 120, 0]], closed: true, layer: panel}
  # A slot 40 between the centres of its round ends, radius 6.
  - polyline:
      id: slot
      points: [[110, 74, 0], {point: [150, 74, 0], bulge: 1}, [150, 86, 0], {point: [110, 86, 0], bulge: 1}]
      closed: true
      layer: panel
  # Four mounting holes, 8 across, 15 in from the panel's edges.
  - circle: {id: hole-1, center: [75, 65, 0], radius: 4, layer: holes}
  - circle: {id: hole-2, center: [345, 65, 0], radius: 4, layer: holes}
  - circle: {id: hole-3, center: [75, 235, 0], radius: 4, layer: holes}
  - circle: {id: hole-4, center: [325, 235, 0], radius: 4, layer: holes}
  # Two gland holes for M20 glands.
  - circle: {id: gland-1, center: [270, 165, 0], radius: 10.25, layer: holes}
  - circle: {id: gland-2, center: [310, 165, 0], radius: 10.25, layer: holes}
  # The overall size.
  - dimension: {id: width, kind: linear, points: [[60, 50, 0], [360, 50, 0]], location: [210, 30, 0], layer: dims}
  - dimension: {id: height, kind: linear, angle: 90, points: [[60, 50, 0], [60, 250, 0]], location: [40, 150, 0], layer: dims}
  - dimension: {id: chamfer, kind: aligned, points: [[360, 230, 0], [340, 250, 0]], location: [360, 250, 0], layer: dims}
  # The cut-outs, in their own style.
  - dimension: {id: fan-width, kind: linear, points: [[90, 200, 0], [210, 200, 0]], location: [150, 212, 0], dimension_style: cutout, layer: dims}
  - dimension: {id: fan-height, kind: linear, angle: 90, points: [[210, 120, 0], [210, 200, 0]], location: [222, 160, 0], dimension_style: cutout, layer: dims}
  - dimension: {id: plate-width, kind: linear, points: [[250, 80, 0], [330, 80, 0]], location: [290, 68, 0], dimension_style: cutout, layer: dims}
  - dimension: {id: plate-height, kind: linear, angle: 90, points: [[330, 80, 0], [330, 120, 0]], location: [342, 100, 0], dimension_style: cutout, layer: dims}
  # Where the fan cut-out sits, by the panel's corner.
  - dimension: {id: fan-from-left, kind: linear, points: [[60, 50, 0], [90, 120, 0]], location: [75, 110, 0], layer: dims}
  - dimension: {id: fan-from-bottom, kind: linear, angle: 90, points: [[60, 50, 0], [90, 120, 0]], location: [82, 85, 0], layer: dims}
  # The slot: its length between centres and its end's radius.
  - dimension: {id: slot-length, kind: linear, points: [[110, 80, 0], [150, 80, 0]], location: [130, 96, 0], dimension_style: reference, layer: dims}
  - dimension: {id: slot-end, kind: radius, center: [150, 80, 0], point: [156, 80, 0], location: [168, 64, 0], layer: dims}
  # The holes: one mounting hole for all four, and a gland hole.
  - dimension: {id: mounting-holes, kind: diameter, center: [75, 235, 0], point: [79, 235, 0], location: [95, 270, 0], text: 4X <>, layer: dims}
  - dimension: {id: gland-hole, kind: diameter, center: [310, 165, 0], point: [320.25, 165, 0], location: [345, 190, 0], dimension_style: reference, layer: dims}
  - dimension: {id: gland-pitch, kind: linear, points: [[270, 165, 0], [310, 165, 0]], location: [290, 140, 0], dimension_style: reference, layer: dims}
  - mtext: {contents: "BACK PANEL BP-1\nMADE-UP ENCLOSURE, 2 MM SHEET", position: [250, 20, 0], height: 3.5, layer: notes}
