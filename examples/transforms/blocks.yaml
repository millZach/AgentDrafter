# The made-up blocks the transforms sheet inserts: a terminal and a field
# transmitter with its tag and service as attributes.
units: mm
layers:
  symbols: {color: yellow}
blocks:
  TERM:
    objects:
      - polyline: {points: [[-3, -4, 0], [3, -4, 0], [3, 4, 0], [-3, 4, 0]], closed: true, layer: symbols}
      - attdef: {tag: NUMBER, position: [0, 0, 0], height: 2.5, justify: middle_center}
  XMTR:
    objects:
      - circle: {center: [0, 0, 0], radius: 5, layer: symbols}
      - line: {from: [5, 0, 0], to: [12, 0, 0], layer: symbols}
      - arc: {center: [0, 0, 0], radius: 3, start_angle: 90, end_angle: 180, layer: symbols}
      - attdef: {tag: TAG, position: [-5, 7, 0], height: 2.5}
      - attdef: {tag: SERVICE, position: [-5, -10, 0], height: 2}
