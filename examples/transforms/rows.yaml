# The transforms sheet's one row: the objects each group starts with.
rows:
  - sheet: TRN-001
    template: templates/panel.yaml
    values:
      TITLE: TRANSFORMS - MADE-UP JUNCTION BOX JB-900
    objects:
      # Turned: a copy of each a quarter turn about [215, 212, 0].
      - insert: {id: strip-a, block: TERM, position: [40, 220, 0], attributes: {NUMBER: '1'}, layer: symbols}
      - insert: {id: strip-b, block: TERM, position: [40, 230, 0], attributes: {NUMBER: '2'}, layer: symbols}
      - text: {id: tb-label, contents: TB-1, position: [33, 240, 0], height: 3, layer: notes}
      - polyline: {id: wire-bend, points: [[43, 220, 0], {point: [70, 220, 0], arc_angle: 90}, [80, 230, 0], [80, 245, 0]], width: 0.5, layer: wires}
      - arc: {id: arc-a, center: [95, 200, 0], radius: 8, start_angle: 0, end_angle: 120, layer: wires}
      - ellipse: {id: lens, center: [65, 190, 0], major_axis: [12, 4, 0], ratio: 0.4, layer: symbols}
      - hatch: {id: patch, pattern: CROSS, boundary: [{polyline: {points: [[25, 175, 0], [45, 175, 0], [45, 190, 0], [25, 190, 0]]}}], layer: hatch}
      # Doubled: a copy of each scaled by 2 about [125, 50, 0].
      - circle: {id: ring, center: [35, 80, 0], radius: 6, layer: symbols}
      - donut: {id: dot, center: [35, 80, 0], outside_diameter: 3, layer: symbols}
      - mtext: {id: memo, contents: "SPARE\nENTRY", position: [25, 110, 0], height: 2.5, width: 30, layer: notes}
      - leader: {id: note-leader, points: [[40, 84, 0], [55, 95, 0], [62, 95, 0]], annotation: {text: GLAND, height: 2.5}, layer: notes}
      - dimension: {id: ring-width, kind: linear, points: [[29, 80, 0], [41, 80, 0]], location: [35, 65, 0], layer: dims}
      # Mirrored across the dashed line x = 355, kept, with mirrored copies.
      - insert: {id: ft-101, block: XMTR, position: [320, 200, 0], attributes: {TAG: FT-101, SERVICE: COOLING WATER}, layer: symbols}
      - leader: {id: ft-tap, points: [[315.1, 201, 0], [310, 198, 0], [306, 204, 0]], annotation: {text: E2, height: 2.5}, layer: notes}
      - text: {id: ft-note, contents: TO JB-900, position: [328, 178, 0], height: 2.5, rotation: 20, layer: notes}
      - line: {id: cable, from: [332, 200, 0], to: [350, 200, 0], layer: wires}
      - spline: {id: loop, fit_points: [[305, 150, 0], [320, 165, 0], [335, 150, 0], [348, 160, 0]], layer: wires}
      - solid: {id: pad, corners: [[310, 110, 0], [330, 110, 0], [320, 125, 0]], layer: symbols}
      - mleader: {id: callout, leaders: [[[318, 120, 0], [325, 135, 0]]], content: {text: PAD}, layer: notes}
      - arc: {id: hook, center: [320, 85, 0], radius: 10, start_angle: 200, end_angle: 340, layer: wires}
      # Mirrored in place across the line y = 50: turned a half turn too.
      - insert: {id: strip-c, block: TERM, position: [380, 60, 0], rotation: 30, attributes: {NUMBER: '3'}, layer: symbols}
      # Mirrored across x = 180 to 30 degrees, its reference reading straight
      # up; and mirrored twice in place across x = 235, its reference still
      # reading forwards.
      - insert: {id: pin-a, block: PIN, position: [165, 50, 0], rotation: 330, attributes: {REF: P1}, layer: symbols}
      - insert: {id: pin-b, block: PIN, position: [220, 50, 0], attributes: {REF: P2}, layer: symbols}
      - text: {id: pin-label, contents: MIRRORED ONCE AND TWICE, position: [150, 30, 0], height: 3, layer: notes}
      # Mirrored across a line at 45 degrees: it reads upwards.
      - text: {id: diag, contents: DIAGONAL, position: [285, 55, 0], height: 3, layer: notes}
