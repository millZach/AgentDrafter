# A made-up title block, 5 by 1.5 inches, its base point its lower right
# corner.
units: in
layers:
  title: {color: white, lineweight: 0.5}
  title-text: {color: green}
text_styles:
  title: {font: romans.shx, width_factor: 0.8}
blocks:
  CARD_TITLE:
    objects:
      - polyline: {points: [[-5, 0, 0], [0, 0, 0], [0, 1.5, 0], [-5, 1.5, 0]], closed: true, layer: title}
      - line: {from: [-5, 0.6, 0], to: [0, 0.6, 0], layer: title}
      - line: {from: [-1.5, 0, 0], to: [-1.5, 0.6, 0], layer: title}
      - text: {contents: DWG NO., position: [-4.95, 0.52, 0], height: 0.08, style: title, justify: top_left, layer: title-text, cell: [[-5, 0, 0], [-1.5, 0.6, 0]]}
      - text: {contents: REV, position: [-1.45, 0.52, 0], height: 0.08, style: title, justify: top_left, layer: title-text, cell: [[-1.5, 0, 0], [0, 0.6, 0]]}
      - attdef: {tag: TITLE, prompt: Title, position: [-2.5, 1.05, 0], height: 0.18, style: title, justify: middle_center, layer: title-text, cell: [[-5, 0.6, 0], [0, 1.5, 0]]}
      - attdef: {tag: DWG_NO, prompt: Drawing number, position: [-3.25, 0.22, 0], height: 0.14, style: title, justify: middle_center, layer: title-text, cell: [[-5, 0, 0], [-1.5, 0.6, 0]]}
      - attdef: {tag: REV, prompt: Revision, default: '0', position: [-0.75, 0.22, 0], height: 0.14, style: title, justify: middle_center, layer: title-text, cell: [[-1.5, 0, 0], [0, 0.6, 0]]}
