# A fixed set of made-up strings in four SHX fonts and two TrueType fonts,
# for comparing AgentDrafter's measured text widths with AutoCAD's own.
# Each string is drawn twice: 2.5 high at the style's width factor, and
# 3.5 high at a width factor of 0.8.
# Build it with: agentdrafter build examples/text-widths.yaml
units: mm

text_styles:
  romans: {font: romans.shx}
  simplex: {font: simplex.shx}
  txt: {font: txt.shx}
  isocp: {font: isocp.shx}
  arial: {font: arial.ttf}
  times: {font: times.ttf}

objects:
