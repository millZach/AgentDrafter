# A made-up 11 x 17 inch sheet, ANSI B, its trim line on the paper's edge
# and a border half an inch inside it, the demo plant's title block in the
# lower right corner, and fixed notes. A sheet's value from its row is
# written `{row: NAME}`, which each row fills in. An object's `id` joins the
# sheet's name to make its ID, such as DEMO-001/border; one without an `id`,
# such as the trim line, takes its place, DEMO-001/objects[0].
units: in
paper: ANSI B landscape
block_library: ../blocks.yaml
layers:
  trim: {color: 8, lineweight: 0.13}
  border: {color: white, lineweight: 0.7}
  notes: {color: cyan}
text_styles:
  notes: {font: romans.shx, width_factor: 0.8}
objects:
  - polyline: {points: [[0, 0, 0], [17, 0, 0], [17, 11, 0], [0, 11, 0]], closed: true, layer: trim}
  - polyline: {points: [[0.5, 0.5, 0], [16.5, 0.5, 0], [16.5, 10.5, 0], [0.5, 10.5, 0]], closed: true, layer: border, id: border}
  - insert:
      block: TITLE_BLOCK
      position: [16.5, 0.5, 0]
      name: title-block
      attributes:
        TITLE: {row: TITLE}
        DWG_NO: {row: DWG_NO}
        SHEET: {row: SHEET}
        REV: {row: REV}
        DATE: {row: DATE}
        DRAWN: AD
  - text: {contents: {row: TITLE}, position: [1, 10, 0], height: 0.25, style: notes, layer: notes, id: heading}
  - mtext:
      contents: |
        NOTES:
        1. THIS IS A MADE-UP DRAWING OF THE DEMO PLANT.
        2. DIMENSIONS ARE IN INCHES.
      position: [10, 4.5, 0]
      height: 0.12
      width: 6
      style: notes
      layer: notes
      id: notes
