# One row per loop sheet of the demo plant. Every tag, number, cable and
# name here is made up. Each row names its template, gives the values the
# template writes `{row: NAME}`, and holds its own two objects: the field
# device, whose bubble sits at [2, 6.5, 0], and the controller I/O channel,
# whose left side sits at [11.5, 6.5, 0]. The blocks are in blocks.yaml.
rows:
  # Analog inputs: two-wire transmitters, loop powered.
  - sheet: DP-LD-101
    template: templates/loop-2-wire.yaml
    values:
      TITLE: LOOP 101 - RAW WATER INLET FLOW
      LOOP: '101'
      AREA: 100 RAW WATER
      DWG_NO: DP-LD-101
      SHEET: 1 OF 8
      REV: '0'
      DATE: 2026-11-11
      REV_DESC: FIRST ISSUE
      SERVICE: FT-101 RAW WATER INLET FLOW
      SIGNAL: 0-500 GPM = 4-20 mA, 2-WIRE, LOOP POWERED
      FIELD_CABLE: C-101
      FIELD_SPEC: 1 PR 16 AWG TSP
      JB: JB-100
      TB: TB1
      TERM_1: '1'
      TERM_2: '2'
      WIRE_1: 101+
      WIRE_2: 101-
      HOME_CABLE: MC-100
      HOME_SPEC: PR 01, 12 PR 16 AWG
      CABINET: CONTROL PANEL CP-100
    objects:
      - insert: {block: TRANSMITTER, position: [2, 6.5, 0], attributes: {FUNC: FT, LOOP: '101'}, id: device, name: FT-101}
      - insert: {block: AI_CHANNEL, position: [11.5, 6.5, 0], attributes: {T1: '1', T2: '2', CARD: R1-S02, CH: '01', POINT: FT101_PV}, id: io-channel, name: FT101_PV}

  - sheet: DP-LD-102
    template: templates/loop-2-wire.yaml
    values:
      TITLE: LOOP 102 - CLEARWELL LEVEL
      LOOP: '102'
      AREA: 100 RAW WATER
