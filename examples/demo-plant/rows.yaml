      - insert: {block: RTD_CHANNEL, position: [11.5, 6.5, 0], attributes: {T1: '1', T2: '2', T3: '3', CARD: R1-S03, CH: '01', POINT: TE103_PV}, id: io-channel, name: TE103_PV}

