      FIELD_CABLE: C-102
      FIELD_SPEC: 1 PR 16 AWG TSP
      JB: JB-100
      TB: TB1
      TERM_1: '3'
      TERM_2: '4'
      WIRE_1: 102+
      WIRE_2: 102-
      HOME_CABLE: MC-100
      HOME_SPEC: PR 02, 12 PR 16 AWG
      CABINET: CONTROL PANEL CP-100
    objects:
      - insert: {block: TRANSMITTER, position: [2, 6.5, 0], attributes: {FUNC: LT, LOOP: '102'}, id: device, name: LT-102}
      - insert: {block: AI_CHANNEL, position: [11.5, 6.5, 0], attributes: {T1: '3', T2: '4', CARD: R1-S02, CH: '02', POINT: LT102_PV}, id: io-channel, name: LT102_PV}

  # An RTD input: a three-wire element, on the three-wire template.
  - sheet: DP-LD-103
