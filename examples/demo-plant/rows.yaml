      FIELD_CABLE: C-103
      FIELD_SPEC: 1 TRIAD 16 AWG TSP
      JB: JB-100
      TB: TB1
      TERM_1: '5'
      TERM_2: '6'
      TERM_3: '7'
      WIRE_1: 103A
