# Made-up sheet showing revision clouds (#72): rectangular normal,
# rectangular calligraphy, polygonal normal, polygonal calligraphy and
# reversed (arcs bowing inward).
# Build it with: agentdrafter build examples/revision-cloud.yaml
units: in
paper: ANSI A landscape
layers:
  trim: {color: 8, lineweight: 0.13}
  REVCLOUD: {color: red, lineweight: 0.35}
  NOTES: {color: cyan}
objects:
  - polyline:
      id: trim
      points: [[0, 0, 0], [11, 0, 0], [11, 8.5, 0], [0, 8.5, 0]]
      closed: true
      layer: trim
  - text:
      id: label-rect-normal
      contents: "RECTANGLE - NORMAL"
      position: [1.0, 6.9, 0]
      height: 0.16
      layer: NOTES
  - revision_cloud:
      id: cloud-rect-normal
      rectangle:
        from: [1.0, 4.7, 0]
        to: [4.8, 6.5, 0]
      arc_length: 0.35
      style: normal
      layer: REVCLOUD
  - text:
      id: label-rect-calligraphy
      contents: "RECTANGLE - CALLIGRAPHY"
      position: [5.6, 6.9, 0]
      height: 0.16
      layer: NOTES
  - revision_cloud:
      id: cloud-rect-calligraphy
      rectangle:
        from: [5.6, 4.7, 0]
        to: [9.6, 6.5, 0]
      arc_length: 0.35
      style: calligraphy
      layer: REVCLOUD
  - text:
      id: label-poly-normal
      contents: "POLYGON - NORMAL"
      position: [1.0, 3.8, 0]
      height: 0.16
      layer: NOTES
  - revision_cloud:
      id: cloud-poly-normal
      polygon:
        - [1.0, 1.3, 0]
        - [4.4, 1.3, 0]
        - [4.4, 2.5, 0]
        - [2.9, 2.5, 0]
        - [2.9, 3.4, 0]
        - [1.0, 3.4, 0]
      arc_length: 0.35
      style: normal
      layer: REVCLOUD
  - text:
      id: label-poly-calligraphy
      contents: "POLYGON - CALLIGRAPHY (REVERSED)"
      position: [5.6, 3.8, 0]
      height: 0.16
      layer: NOTES
  - revision_cloud:
      id: cloud-poly-calligraphy-rev
      polygon:
        - [5.6, 1.3, 0]
        - [9.6, 1.3, 0]
        - [8.8, 3.4, 0]
        - [6.2, 3.4, 0]
      arc_length: 0.4
      style: calligraphy
      reverse: true
      layer: REVCLOUD
