# Every object type a sheet description holds so far, on layers with
# linetypes, in millimetres. A made-up plate with a bore, a slot and a few
# curves; no trade.
# Build it with: agentdrafter build examples/geometry.yaml
units: mm

linetypes:
  HIDDEN:
    description: Hidden __ __ __ __
    pattern: [6.35, -3.175]
  CENTER:
    description: Center ____ _ ____ _
    pattern: [31.75, -6.35, 6.35, -6.35]
  DOT:
    description: Dot . . . . . . .
    pattern: [0, -0.125 in]

layers:
  outline: {colour: white, lineweight: 0.5}
  hidden: {colour: yellow, linetype: HIDDEN, lineweight: 0.25}
  centre: {colour: red, linetype: CENTER, lineweight: 0.18}
  curves: {colour: 3, lineweight: 0.35 mm}
  construction: {colour: 8, linetype: DOT, lineweight: 0.13}

objects:
  # The plate: a closed outline with a rounded end.
  - polyline:
      points: [[0, 0, 0], [120, 0, 0], [120, 80, 0], [0, 80, 0]]
      closed: true
      layer: outline
  - arc: {centre: [120, 40, 0], radius: 40, start_angle: 270, end_angle: 90, layer: outline}

  # The bore, its hidden sides and its centre lines.
  - circle: {centre: [60, 40, 0], radius: 20, layer: outline}
  - line: {from: [40, 0, 0], to: [40, 80, 0], layer: hidden}
  - line: {from: [80, 0, 0], to: [80, 80, 0], layer: hidden}
  - line: {from: [30, 40, 0], to: [90, 40, 0], layer: centre}
  - line: {from: [60, 10, 0], to: [60, 70, 0], layer: centre}

  # A small hole, sized in inches.
  - circle: {centre: [15, 15, 0], radius: 0.25 in, layer: outline}

  # An ellipse and half of a larger one.
  - ellipse: {centre: [60, 130, 0], major_axis: [30, 0, 0], ratio: 0.5, layer: curves}
  - ellipse:
      centre: [60, 130, 0]
      major_axis: [40, 0, 0]
      ratio: 0.6
      start_angle: 0
      end_angle: 180
      layer: curves

  # Two splines: one through points, one by control points.
  - spline:
      fit_points: [[180, 0, 0], [200, 30, 0], [220, 10, 0], [240, 40, 0]]
      layer: curves
  - spline:
      control_points: [[180, 60, 0], [195, 100, 0], [215, 50, 0], [230, 110, 0], [245, 70, 0]]
      degree: 3
      layer: curves

  # 3D: a polyline that climbs, a flat one above the sheet, and a vertical line.
  - polyline:
      points: [[150, 0, 0], [170, 0, 10], [170, 20, 20], [150, 20, 30]]
      layer: construction
  - polyline:
      points: [[150, 40, 5], [170, 40, 5], [170, 60, 5]]
      layer: construction
  - line: {from: [0, 0, 0], to: [0, 0, 50], layer: construction}
