name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the older run; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    # The merge bar: check (ubuntu-latest), check (windows-latest), check (macos-latest).
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain named in rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints, warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # The drawing pipeline runs in the viewer's page as WebAssembly (ADR-0011): the core must build for it.
      - name: The core builds for WebAssembly
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p agentdrafter-core --target wasm32-unknown-unknown --locked

      # The judge drives AutoCAD and never runs here; only its reading and scoring are tested, on made-up data.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Judge tests (made-up data, no AutoCAD)
        run: python -m unittest discover -s tools/judge/tests
