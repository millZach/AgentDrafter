name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the older run; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    # The merge bar: check (ubuntu-latest), check (windows-latest), check (macos-latest).
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain named in rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints, warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # The drawing pipeline runs in the viewer's page as WebAssembly (ADR-0011): the core must build for it.
      - name: The core builds for WebAssembly
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p agentdrafter-core --target wasm32-unknown-unknown --locked

      # The judge drives AutoCAD and never runs here; only its reading and scoring are tested, on made-up data.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Judge tests (made-up data, no AutoCAD)
        run: python -m unittest discover -s tools/judge/tests

      # The demo plant (examples/demo-plant): every sheet built to DWG and plotted to PDF, and the
      # checker run on it; a failed check fails the job. Each system's SHA-256 of every DWG and PDF
      # goes to the `demo-plant` job below, which holds the three systems to the same bytes.
      - name: The demo plant builds, plots and passes the checker
        shell: bash
        run: |
          agentdrafter() { cargo run --quiet -p agentdrafter-cli --locked -- "$@"; }
          agentdrafter build examples/demo-plant
          echo
          agentdrafter plot examples/demo-plant
          echo
          agentdrafter check examples/demo-plant > demo-plant-check.json
          python - <<'PY'
          import hashlib, json, pathlib, sys

          reply = json.loads(pathlib.Path("demo-plant-check.json").read_text(encoding="utf-8"))
          if not reply["ok"]:
              sys.exit(f"the checker could not read the demo plant: {reply['error']}")
          result = reply["result"]
          print(result["message"])
          for finding in result["findings"]:
              print(f"{finding['sheet']} {finding['rule']}: {finding['message']}")
          if not result["passed"]:
              sys.exit("the demo plant fails the checker")

          out = pathlib.Path("examples/demo-plant/dwg")
          lines = []
          for sheet in result["sheets"]:
              for extension in (".dwg", ".pdf"):
                  path = out / (sheet + extension)
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n")
          pathlib.Path("demo-plant-hashes.txt").write_bytes("".join(lines).encode("ascii"))
          print("".join(lines), end="")
          PY

      - name: Keep the demo plant's hashes, DWGs and PDFs
        uses: actions/upload-artifact@v7
        with:
          name: demo-plant-${{ matrix.os }}
          path: |
            demo-plant-hashes.txt
            examples/demo-plant/dwg/
          if-no-files-found: error
          retention-days: 7

  demo-plant:
    # Every DWG and PDF of the demo plant is the same, byte for byte, on Windows, Linux and macOS.
    name: demo plant (the same on every system)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: demo-plant-*

      - name: Compare each system's hashes of every DWG and PDF
        run: |
          linux=demo-plant-ubuntu-latest/demo-plant-hashes.txt
          test -s "$linux"
          cat "$linux"
          for os in windows-latest macos-latest; do
            echo "Linux against $os:"
            diff -u "$linux" "demo-plant-$os/demo-plant-hashes.txt"
          done
          echo "Every DWG and PDF is the same on Windows, Linux and macOS."

  wheel:
    # The pip package (docs/python.md): one wheel per system, built for every Python from 3.11 on,
    # installed into clean virtual environments of the oldest and the newest Python, its command run
    # and its library imported and tested. Nothing is uploaded anywhere: the wheel is kept only as
    # this run's artifact.
    name: wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Where a virtual environment keeps its programs.
      BIN: ${{ matrix.os == 'windows-latest' && 'Scripts' || 'bin' }}
      # The virtual environments and the demo plant's copies, in the checkout, by a relative path
      # that every program on every system reads alike.
      TRY: wheel-try
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain named in rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        id: oldest
        with:
          python-version: "3.11"

      - uses: actions/setup-python@v7
        id: newest
        with:
          python-version: "3.14"

      - name: Build the wheel
        shell: bash
        run: |
          "${{ steps.newest.outputs.python-path }}" -m venv "$TRY/build"
          "$TRY/build/$BIN/python" -m pip install --quiet --disable-pip-version-check "maturin==1.16.0"
          "$TRY/build/$BIN/python" -m maturin build --release --out dist
          ls -l dist

      - name: Install the wheel into a clean virtual environment of Python 3.11 and of 3.14
        shell: bash
        run: |
          for python in "${{ steps.oldest.outputs.python-path }}" "${{ steps.newest.outputs.python-path }}"; do
            version=$("$python" -c 'import sys; print("%d.%d" % sys.version_info[:2])')
            "$python" -m venv "$TRY/venv-$version"
            "$TRY/venv-$version/$BIN/python" -m pip install --quiet --disable-pip-version-check dist/*.whl
            echo "Python $version: $("$TRY/venv-$version/$BIN/agentdrafter" --version)"
          done

      # A copy of the demo plant, built and checked by the installed command, and another built and
      # checked through the library, on the oldest Python. The two builds' DWGs are the same bytes.
      - name: The installed command and the library build the demo plant and it passes the checker
        shell: bash
        run: |
          venv="$TRY/venv-3.11"
          cp -R examples/demo-plant "$TRY/by-command"
          cp -R examples/demo-plant "$TRY/by-library"
          "$venv/$BIN/agentdrafter" build "$TRY/by-command"
          echo
          "$venv/$BIN/agentdrafter" check "$TRY/by-command" > "$TRY/check.json"
          "$venv/$BIN/python" - "$TRY/check.json" "$TRY/by-library" <<'PY'
          import json, pathlib, sys

          import agentdrafter

          by_command = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("The command:", by_command["result"]["message"])
          if not (by_command["ok"] and by_command["result"]["passed"]):
              sys.exit(f"the demo plant fails the checker: {by_command}")

          plant = sys.argv[2]
          built = agentdrafter.build(source=plant)
          if not built["ok"]:
              sys.exit(f"the library could not build the demo plant: {built}")
          print(f"The library: built {built['result']['built']} sheets")
          checked = agentdrafter.check(source=plant)
          print("The library:", checked["result"]["message"])
          if not (checked["ok"] and checked["result"]["passed"]):
              sys.exit(f"the demo plant fails the checker through the library: {checked}")
          PY
          diff -r "$TRY/by-command/dwg" "$TRY/by-library/dwg"
          echo "The command's DWGs and the library's are the same."

      - name: Python tests, through the installed package, on Python 3.11 and 3.14
        shell: bash
        run: |
          for version in 3.11 3.14; do
            "$TRY/venv-$version/$BIN/python" -m unittest discover -s python/tests -v
          done

      - name: Keep the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
