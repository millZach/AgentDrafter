[workspace]
resolver = "2"
members = ["crates/agentdrafter-core", "crates/agentdrafter-cli", "crates/agentdrafter-py", "crates/agentdrafter-viewer"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/millZach/AgentDrafter"
publish = false

[workspace.dependencies]
# acadrust is pinned to the commit the DWG bake-off judged (ADR-0009).
# Moving this pin means running the judge again.
acadrust = { git = "https://github.com/hakanaktt/acadrust", rev = "4d07b528552ff06b7ddeafdd745d21dddb019ef2" }
# JSON, read with every number correctly rounded (float_roundtrip), so a
# number reaches the core as the same value through every interface, and a
# reply read back, as the MCP server's structured content is, keeps every
# digit of the reply it was written from (ADR-0007).
serde_json = { version = "1", features = ["float_roundtrip"] }

# The viewer's WebAssembly module (crates/agentdrafter-viewer), built by
# `npm run build` in viewer/: small and fast, without touching how the
# command line is built.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
