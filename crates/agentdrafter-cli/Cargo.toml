[package]
name = "agentdrafter-cli"
description = "The agentdrafter command: a thin command line over agentdrafter-core that prints JSON."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "agentdrafter"
path = "src/bin/agentdrafter.rs"

[dependencies]
agentdrafter-core = { path = "../agentdrafter-core" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The HTTP API's request parser (MIT or Apache-2.0), the constant-time
# compare of its token (BSD-3-Clause), and the system's randomness the
# token is made from (MIT or Apache-2.0).
httparse = "1.10.1"
subtle = "2.6.1"
getrandom = "0.3.4"

[dev-dependencies]
# The servers' tests read a reply's numbers as the bytes they were sent in.
serde_json = { workspace = true, features = ["raw_value"] }
# The journal's tests kill the command mid-commit, at a step the core's
# test-only seam stops it at; the binary built for them has it, no other.
agentdrafter-core = { path = "../agentdrafter-core", features = ["test-seams"] }
