[package]
name = "agentdrafter-viewer"
description = "The viewer's renderer: a sheet's display list drawn with WebGL2, compiled to WebAssembly for the page (ADR-0011)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib is the WebAssembly module the page loads; rlib lets the mesh be
# tested natively with `cargo test`.
crate-type = ["cdylib", "rlib"]

[dependencies]
agentdrafter-core = { path = "../agentdrafter-core" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# Fills (hatches, TrueType text) become triangles for the GPU (MIT or
# Apache-2.0).
lyon_tessellation = "1.0.23"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The bridge between the module and the page, and the page's WebGL2 (each
# MIT or Apache-2.0). wasm-bindgen is pinned to the wasm-bindgen-cli that
# builds the page's glue, which must be the same version.
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
] }
