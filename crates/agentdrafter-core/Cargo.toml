[package]
name = "agentdrafter-core"
description = "AgentDrafter's core: the library that knows drawings. Every interface is a thin layer over it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
acadrust.workspace = true
saphyr-parser = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
# The drawing pipeline's rasteriser and the PNG it writes (ADR-0011).
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
png = "0.18.1"
# The fingerprint of the record an output is stamped with.
sha2 = "0.11.1"
# The PDF a plot writes (MIT or Apache-2.0), and the deflate that packs its
# drawing and unpacks a CTB plot style (MIT, Zlib or Apache-2.0).
pdf-writer = "0.15.0"
miniz_oxide = "0.8.9"

[dev-dependencies]
jsonschema = { version = "0.61.1", default-features = false }
