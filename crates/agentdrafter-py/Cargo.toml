[package]
name = "agentdrafter-py"
description = "The Python library's extension: a thin binding of agentdrafter-core's registry of commands, which also carries the agentdrafter command."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "agentdrafter_py"
crate-type = ["cdylib"]
# The extension is tested through Python, from the wheel it is built into
# (python/tests); a Rust test of it would need a Python to link against.
test = false
doctest = false

[dependencies]
agentdrafter-core = { path = "../agentdrafter-core" }
agentdrafter-cli = { path = "../agentdrafter-cli" }
# The binding to Python (MIT or Apache-2.0), built against the stable ABI
# so one wheel per system serves Python 3.11 and every later version.
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
serde_json = "1"
