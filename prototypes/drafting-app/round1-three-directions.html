<!doctype html>
<!--
  PROTOTYPE, throwaway. Issue #144: the drafting app for people.
  Three directions for how drawing and editing could look, switched by ?variant=A|B|C.
  The engine is faked in this page; the sheet is made up. Nothing here is production code.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>AgentDrafter drafting app, prototype</title>
<style>
:root{
  --ui:Bahnschrift,"DIN Alternate","DIN 2014","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font:14px/1.35 var(--ui);display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #3d8bfd;outline-offset:1px}
h2{font-size:12px;font-weight:600;margin:0 0 6px}
.grow{flex:1}

/* the prototype's own strip: not part of any design */
#proto{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#000;color:#ffd84a;font:13px/1.2 var(--ui);overflow-x:auto;white-space:nowrap}
#proto button{background:#000;border:1px solid #ffd84a;color:#ffd84a;border-radius:4px;padding:3px 9px}
#proto b{min-width:150px;text-align:center}
#proto .tag{opacity:.75;margin-right:4px}

#app{position:relative;min-height:0;display:grid}
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:14px;z-index:8;max-width:min(520px,calc(100% - 24px));padding:8px 14px;border-radius:8px;background:#14233b;color:#fff;border-left:4px solid #3d8bfd;box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:none;transition:opacity .25s}
#toast.agent{border-left-color:#ff5fa2}
#toast.off{opacity:0}

/* shared pieces, plain; each direction dresses them */
.prow{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;align-items:center;padding:3px 0}
.prow span{opacity:.7}
.prow input,.prow select{width:100%;min-width:0;padding:4px 6px;border-radius:4px;border:1px solid currentColor;background:transparent}
.prow output{font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{opacity:.65;margin:4px 0}
.journal{list-style:none;margin:0;padding:0}
.journal li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;padding:6px 0;border-top:1px solid rgba(128,128,128,.28)}
.journal .n{font-family:var(--mono);opacity:.7}
.journal .meta{font-size:12px;opacity:.7}
.journal .agent .who{color:#ff5fa2}
.journal .you .who{color:#3d8bfd}

/* ───────── A. Drafting board ───────── */
body[data-v=A] #app{grid-template:"top top top" auto "tools stage side" minmax(0,1fr) "cmd cmd cmd" auto "status status status" auto / 52px minmax(0,1fr) 276px;background:#2b323b;color:#d7dde4}
body[data-v=A] #cv{cursor:none}
.a-top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 10px;height:40px;border-bottom:1px solid #3b4551;min-width:0}
.a-brand{font-weight:700;margin-right:4px}
.a-tabs{display:flex;align-self:stretch;overflow-x:auto;min-width:0}
.a-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:0 12px;color:#8b97a5;white-space:nowrap}
.a-tabs button[aria-selected=true]{color:#fff;border-color:#f0b429}
.a-layer{display:flex;align-items:center;gap:6px;color:#8b97a5}
.a-layer select{background:#1b2026;border:1px solid #47525f;border-radius:3px;padding:3px 6px;color:#d7dde4}
.a-btn{background:#353e49;border:1px solid #47525f;border-radius:3px;padding:4px 10px;white-space:nowrap}
.a-btn.primary{background:#f0b429;border-color:#f0b429;color:#1b2026;font-weight:600}
.a-btn[aria-pressed=true]{background:#1b2026;border-color:#f0b429;color:#f0b429}
.a-tools{grid-area:tools;display:flex;flex-direction:column;gap:2px;padding:6px 4px;border-right:1px solid #3b4551}
.a-tools button{position:relative;height:44px;background:none;border:1px solid transparent;border-radius:3px;display:grid;place-items:center;color:#c3ccd6}
.a-tools button[aria-pressed=true]{background:#1b2026;border-color:#f0b429;color:#f0b429}
.a-tools kbd{position:absolute;right:3px;bottom:1px;font:10px var(--mono);opacity:.7}
.a-side{grid-area:side;border-left:1px solid #3b4551;overflow:auto;padding:10px 12px;min-height:0}
.a-side h2{color:#8b97a5;margin-top:4px}
.a-side .props{margin-bottom:16px}
.a-side .prow input,.a-side .prow select{border-color:#47525f;background:#1b2026}
.a-cmd{grid-area:cmd;background:#1b2026;border-top:1px solid #3b4551;font-family:var(--mono);font-size:13px;padding:4px 10px 6px}
.a-hist{color:#8b97a5;min-height:3.9em;display:flex;flex-direction:column;justify-content:flex-end}
.a-hist div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-cmd form{display:flex;gap:8px;align-items:center;margin:0}
.a-prompt{color:#f0b429;white-space:nowrap}
.a-cmd input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-family:var(--mono);font-size:16px;padding:3px 0;caret-color:#f0b429}
.a-status{grid-area:status;display:flex;align-items:center;gap:8px;padding:3px 10px;font-size:12px;border-top:1px solid #3b4551;color:#8b97a5;min-width:0}
.a-status .coords{font-family:var(--mono);min-width:130px;color:#d7dde4}
.a-status .a-btn{padding:1px 8px;font-size:12px}
.a-status .state{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-panelbtn,.a-close{display:none}
@media (max-width:760px){
  body[data-v=A] #app{grid-template:"top" auto "stage" minmax(0,1fr) "tools" auto "cmd" auto "status" auto / minmax(0,1fr)}
  .a-brand,.a-layer span{display:none}
  .a-tools{flex-direction:row;border-right:0;border-top:1px solid #3b4551;padding:4px 6px}
  .a-tools button{flex:1}
  .a-hist{min-height:1.3em}.a-hist div:not(:last-child){display:none}
  .a-side{display:none;position:absolute;left:0;right:0;bottom:0;max-height:62%;z-index:6;background:#2b323b;border-left:0;border-top:2px solid #f0b429;box-shadow:0 -12px 30px rgba(0,0,0,.5)}
  .a-side.open{display:block}
  .a-panelbtn{display:inline-block}
  .a-close{display:block;float:right}
  .a-status .coords{min-width:0}.a-status .state{display:none}
}

/* ───────── B. On the sheet ───────── */
body[data-v=B] #app{grid-template:"stage" minmax(0,1fr) / minmax(0,1fr);color:#16181b}
body[data-v=B] #toast{top:68px;background:#16181b}
.b-pill{position:absolute;z-index:4;display:flex;gap:4px;align-items:center;background:#fff;border-radius:12px;padding:5px;box-shadow:0 6px 22px rgba(8,28,22,.4)}
.b-pill button,.b-pill select{border:0;background:none;border-radius:8px;padding:7px 10px;white-space:nowrap}
.b-pill button:hover{background:#eef1ee}
.b-sheet{top:12px;left:12px}.b-sheet select{font-weight:600}
.b-acts{top:12px;right:12px}
.b-pill .b-accept{background:#f4d35e;font-weight:600}
.b-pill .b-accept:hover{background:#eec63f}
.b-dock{left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px;gap:2px;border-radius:16px}
.b-dock .tool{display:grid;justify-items:center;gap:1px;min-width:54px;padding:7px 6px 4px;font-size:12px;border-radius:11px}
.b-dock .tool[aria-pressed=true],.b-dock .tool[aria-pressed=true]:hover{background:#16181b;color:#fff}
.b-dock i{width:1px;align-self:stretch;background:#d5dad6;margin:4px 4px}
.b-dock .lay{display:flex;align-items:center;gap:4px;padding-left:6px}
.b-dock .sw{width:12px;height:12px;border-radius:3px;flex:none}
.b-dock select{padding:7px 4px;max-width:92px}
.b-hint{left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16181b;color:#fff;border-radius:999px;padding:6px 6px 6px 16px;gap:10px;white-space:nowrap}
.b-hint button{background:#fff;color:#16181b;border-radius:999px;padding:4px 12px}
.b-hint button:hover{background:#f4d35e}
.b-bubble{z-index:5;transform:translate(-50%,-100%);max-width:calc(100% - 16px)}
.b-bubble.below{transform:translate(-50%,0)}
.b-bubble .what{padding:0 8px 0 10px;font-weight:600;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.b-bubble .del{color:#c2271d}
.b-bubble input{border:1px solid #9aa39c;border-radius:8px;padding:6px 8px;font-size:16px;width:min(240px,52vw)}
.b-pop{position:absolute;z-index:6;top:64px;right:12px;width:min(340px,calc(100% - 24px));max-height:62%;overflow:auto;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(8,28,22,.45)}
@media (max-width:760px){
  .b-acts .b-undo span{display:none}
  .b-dock{width:calc(100% - 16px);justify-content:space-between}
  .b-dock .tool{min-width:0;flex:1}
  .b-dock select{max-width:70px}
}

/* ───────── C. Shared log ───────── */
body[data-v=C] #app{grid-template:"col stage" minmax(0,1fr) / 372px minmax(0,1fr);background:#fff;color:#14233b}
.c-col{grid-area:col;display:flex;flex-direction:column;min-height:0;border-right:1px solid #cfd6de;background:#fff}
.c-handle{display:none}
.c-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid #e3e7ec}
.c-head b{font-size:16px}
.c-head select{border:1px solid #b9c2cd;border-radius:6px;padding:4px 6px;background:#fff}
.c-sel{border-bottom:1px solid #e3e7ec;padding:10px 14px;background:#f2f6fb}
.c-sel:empty{display:none}
.c-sel .prow input,.c-sel .prow select{border-color:#b9c2cd;background:#fff}
.c-sel .acts{display:flex;gap:6px;margin-top:8px}
.c-btn{border:1px solid #b9c2cd;background:#fff;border-radius:6px;padding:5px 12px;white-space:nowrap}
.c-btn:hover{background:#f2f6fb}
.c-btn.primary{background:#14233b;border-color:#14233b;color:#fff}
.c-feed{flex:1;min-height:0;overflow:auto;list-style:none;margin:0;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.c-feed li{border-left:3px solid var(--who);padding:1px 0 1px 10px}
.c-feed .you{--who:#0b63ce}.c-feed .agent{--who:#b4326b}
.c-feed .who{font-size:12px;font-weight:600;color:var(--who);display:flex;gap:8px;align-items:baseline}
.c-feed .who time{color:#6b7a8f;font-weight:400}
.c-feed .said{color:#3d4d63}
.c-feed .issued{font-size:12px;color:#6b7a8f}
.c-feed .undo{margin-top:4px;padding:2px 10px;font-size:12px}
.c-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:#14233b;color:#fff}
.c-chip button{background:#fff;color:#14233b;border:0;border-radius:6px;padding:3px 12px}
.c-compose{display:flex;gap:6px;padding:10px;border-top:1px solid #cfd6de;margin:0}
.c-compose input{flex:1;min-width:0;border:1px solid #b9c2cd;border-radius:8px;padding:9px 10px;font-size:16px}
.c-acts{position:absolute;z-index:4;top:12px;right:12px;display:flex;gap:6px}
.c-acts .c-btn{box-shadow:0 2px 8px rgba(20,35,59,.15)}
body[data-v=C] #toast{top:62px}
.c-pal{position:fixed;inset:0;z-index:20;background:rgba(20,35,59,.38);display:grid;place-items:start center;padding-top:14vh}
.c-pal-box{width:min(440px,92vw);background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(20,35,59,.4)}
.c-pal-box input{width:100%;border:0;border-bottom:1px solid #e3e7ec;padding:14px 16px;font-size:17px;outline:0}
.c-pal-box ul{list-style:none;margin:0;padding:6px}
.c-pal-box li button{display:flex;justify-content:space-between;width:100%;border:0;background:none;border-radius:8px;padding:10px 12px;text-align:left}
.c-pal-box li:first-child button,.c-pal-box li button:hover{background:#f2f6fb}
.c-pal-box kbd{font:12px var(--mono);color:#6b7a8f}
@media (max-width:760px){
  body[data-v=C] #app{grid-template:"stage" minmax(0,1fr) "col" auto / minmax(0,1fr)}
  .c-col{border-right:0;border-top:1px solid #cfd6de;max-height:70dvh}
  .c-handle{display:block;border:0;background:none;padding:6px 0 2px;color:#6b7a8f;font-size:12px}
  .c-handle::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#b9c2cd;margin:0 auto 3px}
  .c-col:not(.open) .c-head,.c-col:not(.open) .c-feed{display:none}
  .c-col.open .c-feed{max-height:34dvh}
  .c-compose{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body data-v="A">
<div id="proto">
  <span class="tag">Prototype</span>
  <button id="pprev" aria-label="Previous direction">&larr;</button>
  <b id="pname"></b>
  <button id="pnext" aria-label="Next direction">&rarr;</button>
  <button id="pagent">Agent makes a change</button>
  <button id="preset">Start over</button>
</div>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="toast" class="off"></div></div>
</div>
<script>
'use strict';
/* ───────────── the faked engine: a made-up loop sheet ───────────── */
const W=431.8,H=279.4,TS=1.35,SHEET='DP-LD-101';
const FONT='Bahnschrift,"DIN Alternate","DIN 2014","Segoe UI",sans-serif';
const LAYERS={BORDER:['#e8ebee','#20242a'],TITLE:['#e8ebee','#20242a'],INST:['#4fd8e8','#0b7285'],WIRE:['#6ddc6d','#2b8a3e'],PROCESS:['#e58be5','#9c36b5'],TEXT:['#f2d94e','#7a5d00']};
const TOOLS=[['select','Select','Esc'],['line','Line','L'],['circle','Circle','C'],['move','Move','M'],['erase','Erase','E']];
const CMD={line:'LINE',circle:'CIRCLE',move:'MOVE',erase:'ERASE'};
const ALIAS={L:'line',LINE:'line',C:'circle',CIRCLE:'circle',M:'move',MOVE:'move',E:'erase',ERASE:'erase',U:'undo',UNDO:'undo'};
const ICON={
 select:'<path d="M5 3v14l4-4 3 6 2-1-3-6h5z"/>',
 line:'<path d="M4.5 15.5l11-11"/><rect x="2.5" y="13.5" width="4" height="4"/><rect x="13.5" y="2.5" width="4" height="4"/>',
 circle:'<circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r=".8"/>',
 move:'<path d="M10 2v16M2 10h16M10 2l-3 3M10 2l3 3M10 18l-3-3M10 18l3-3M2 10l3-3M2 10l3 3M18 10l-3-3M18 10l-3 3"/>',
 erase:'<path d="M4 4l12 12M16 4L4 16"/>'};
const icon=n=>`<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${ICON[n]}</svg>`;

let seq=0,nextId=1;
const S={objs:[],sel:null,cmd:null,last:'line',layer:'WIRE',osnap:true,ortho:false,view:{x:0,y:H,k:1},cursor:null,snap:null,journal:[],feed:[],log:[],marks:new Map(),drag:null,agentN:0,mouse:false};
const mk=o=>({id:nextId++,...o});
const Ln=(x1,y1,x2,y2,layer)=>mk({t:'line',a:[x1,y1],b:[x2,y2],layer});
const Rc=(x1,y1,x2,y2,layer)=>mk({t:'pl',pts:[[x1,y1],[x2,y1],[x2,y2],[x1,y2]],closed:true,layer});
const Ci=(x,y,r,layer)=>mk({t:'circle',c:[x,y],r,layer});
const Tx=(x,y,h,s,layer,align='left')=>mk({t:'text',p:[x,y],h,s,layer,align});

function buildSheet(){
  seq=0;nextId=1;
  const o=[
    Rc(10,10,421.8,269.4,'BORDER'),
    Ln(10,250,421.8,250,'BORDER'),Ln(150,50,150,269.4,'BORDER'),Ln(290,50,290,269.4,'BORDER'),
    Tx(80,257,5,'Field','TITLE','center'),Tx(220,257,5,'Junction box JB-12','TITLE','center'),Tx(355,257,5,'Control room','TITLE','center'),
    Ln(271.8,40,421.8,40,'TITLE'),Ln(271.8,10,271.8,40,'TITLE'),Ln(271.8,25,421.8,25,'TITLE'),Ln(381.8,10,381.8,25,'TITLE'),
    Tx(276.8,30,4,'Flow loop, raw water to clarifier','TITLE'),Tx(276.8,15,5,'DP-LD-101','TITLE'),Tx(386.8,15,5,'Rev A','TITLE'),
    Ln(20,130,130,130,'PROCESS'),Ln(60,130,60,158,'INST'),
    Ci(60,170,12,'INST'),Tx(60,171.5,5,'FT','INST','center'),Tx(60,162.5,5,'101','INST','center'),
    Ln(72,173,200,173,'WIRE'),Ln(72,167,200,167,'WIRE'),
    Tx(110,175,3,'101+','WIRE'),Tx(110,162.5,3,'101-','WIRE'),
    Rc(200,170,214,176,'INST'),Rc(200,164,214,170,'INST'),Rc(200,158,214,164,'INST'),
    Tx(207,171.6,3,'1','TEXT','center'),Tx(207,165.6,3,'2','TEXT','center'),Tx(207,159.6,3,'3','TEXT','center'),
    Tx(207,180,3.5,'TB-3','INST','center'),
    Ln(214,173,330,173,'WIRE'),Ln(214,167,330,167,'WIRE'),
    Tx(240,177,3,'C-1012, 1 pair 1.5 mm2','WIRE'),
    Rc(330,150,390,190,'INST'),Tx(360,193.5,4,'AI-03','INST','center'),
    Tx(335,171.6,3,'Ch 4 +','TEXT'),Tx(335,165.6,3,'Ch 4 -','TEXT'),Tx(360,142,3.5,'PLC-1 rack 2','INST','center'),
    Tx(20,90,4,'Notes','TEXT'),Tx(20,82,3,'1. Shield grounded at the control room end only.','TEXT'),Tx(20,76,3,'2. Calibrated range 0 to 250 m3/h.','TEXT'),
  ];
  S.objs=o;S.sel=null;S.cmd=null;S.journal=[];S.feed=[];S.log=[];S.marks.clear();S.agentN=0;S.snap=null;S.drag=null;
  const first={n:++seq,who:'agent',title:`Sheet built from the loop template, ${o.length} objects`,before:JSON.stringify([]),t:new Date(Date.now()-36e5),issued:true};
  S.journal.push(first);S.feed.push({kind:'change',e:first});
  const before=JSON.stringify(S.objs);
  S.objs.push(Tx(25,123,3.5,'Raw water 150 mm','PROCESS'));
  const second={n:++seq,who:'agent',title:'Text "Raw water 150 mm" added on PROCESS',before,t:new Date(Date.now()-9e5)};
  S.journal.push(second);S.feed.push({kind:'change',e:second});
}

/* geometry */
const mcv=document.createElement('canvas').getContext('2d');
const get=id=>S.objs.find(o=>o.id===id);
const selObj=()=>S.sel==null?null:get(S.sel);
const cap=s=>s[0].toUpperCase()+s.slice(1);
const fmt=p=>`${p[0].toFixed(1)}, ${p[1].toFixed(1)}`;
const clip=s=>s.length>24?s.slice(0,22)+'…':s;
function desc(o){return o.t==='text'?`text "${clip(o.s)}"`:`${o.t==='pl'?'polyline':o.t} on ${o.layer}`}
function kind(o){return {line:'Line',pl:'Polyline',circle:'Circle',text:'Text'}[o.t]}
function textW(o){mcv.font=`100px ${FONT}`;return mcv.measureText(o.s).width/100*o.h*TS}
function textBox(o){const w=textW(o),x=o.align==='center'?o.p[0]-w/2:o.p[0];return [x,o.p[1]-o.h*.3,x+w,o.p[1]+o.h*1.05]}
function segs(o){
  if(o.t==='line')return [[o.a,o.b]];
  if(o.t!=='pl')return [];
  const r=[];for(let i=0;i<o.pts.length-1;i++)r.push([o.pts[i],o.pts[i+1]]);
  if(o.closed)r.push([o.pts[o.pts.length-1],o.pts[0]]);return r}
function dseg(p,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],l=vx*vx+vy*vy;let t=l?((p[0]-a[0])*vx+(p[1]-a[1])*vy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*vx,p[1]-a[1]-t*vy)}
function bbox(o){
  if(o.t==='text')return textBox(o);
  if(o.t==='circle')return [o.c[0]-o.r,o.c[1]-o.r,o.c[0]+o.r,o.c[1]+o.r];
  const ps=o.t==='line'?[o.a,o.b]:o.pts,xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]);
  return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
function hit(p){
  // the nearest object within reach wins; of two equally near, the one drawn last
  let best=null,bd=7/S.view.k;

/* change sets, the journal, undo, accept */
