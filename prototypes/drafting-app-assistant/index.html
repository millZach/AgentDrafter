<!doctype html>
<!--
  PROTOTYPE, throwaway. Issue #156: the drafting app's assistant panel, on the drafter's own agent, and what
  the drafter is looking at (build 8 of 10). The panel on the right (a sheet that slides up on a phone) holds
  the chat, the proposals with Keep and Discard, and the journal; it says which agent it runs on; words in the
  command bar that are not a drawing tool's alias go to it. The six questions still open are in the Options
  pill at the top, each option live, the recommended one first and where the page starts (?q1=B&q2=R...).
  It starts from build 7's prototype (prototype/drafting-app-proposals-155) with every choice Zach made in
  builds 4 to 7: proposals on the drawing (B) and the journal's J1. No agent runs: the assistant is scripted
  in the page, and answers "move this 10 to the right" and "what is this?" on the demo plant's display lists
  (demo-plant.js) and its texts and attributes (props.js), all made up and public. Nothing here is
  production code.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>AgentDrafter, the assistant (prototype)</title>
<style>
:root{--frame:#1e2530;--ribbon:#394150;--strip:#303845;--edge:#4b5464;--canvas:#212830;--text:#e6e9ee;--dim:#a3adba;--blue:#4aa3ff;
  --ok:#3ddc84;--warn:#ffb020;--bad:#ff5d5d;--past:#e0a85a;--snap:#f2e24b;
  --ui:"Segoe UI",system-ui,-apple-system,sans-serif;--mono:Consolas,"Cascadia Mono",ui-monospace,Menlo,monospace;--peek:0px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font:13px/1.35 var(--ui);color:var(--text);background:var(--frame);display:grid;grid-template:minmax(0,1fr) / minmax(0,1fr);height:100dvh;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
svg{display:block}

/* the prototype's Options pill and panel: the questions still open, for Zach, outside the product */
#optpill{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:60;background:#000;color:#ffd84a;border:1px solid #ffd84a;border-radius:14px;padding:3px 12px;font:600 12px var(--ui);box-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap}
#optpill[aria-expanded=true]{background:#ffd84a;color:#000}
#optpanel{position:fixed;top:36px;left:50%;transform:translateX(-50%);z-index:60;width:min(760px,calc(100vw - 16px));max-height:calc(100dvh - 46px);overflow:auto;overscroll-behavior:contain;background:#0b0b0b;color:#f3f0e0;border:2px solid #ffd84a;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.7);padding:10px 12px 12px;font-size:12.5px;-webkit-user-select:text;user-select:text}
#optpanel .ohead{display:flex;align-items:center;gap:8px;margin:0 0 4px}
#optpanel .ohead b{color:#ffd84a;font-size:13px;flex:1}
#optpanel .ox{background:none;border:0;color:#ffd84a;font-size:20px;line-height:1;padding:0 4px}
#optpanel .onote{color:#ffd84a;font-weight:600;margin:0 0 6px}
.oq{border-top:1px solid #3a3420;padding:8px 0 7px}
.oq h4{margin:0 0 5px;font-size:12.5px;color:#fff;font-weight:600}
.oseg{display:flex;flex-wrap:wrap;gap:4px}
.oseg button,.ostate button,.obtns button{background:#000;border:1px solid #806c25;color:#ffd84a;border-radius:4px;padding:3px 9px;font-size:12px;text-align:left}
.oseg button[aria-pressed=true]{background:#ffd84a;color:#000;border-color:#ffd84a;font-weight:600}
.oline{margin:5px 0 0;color:#e8e0bc;line-height:1.4}
.ostate{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px;padding:4px 6px;border:1px dashed #806c25;border-radius:4px}
.ostate>span{color:#bfb48a;margin-right:2px}
.ostate button{border-style:dashed;padding:2px 8px}
.ostate button[aria-pressed=true]{background:#3a3214;color:#fff;border-color:#ffd84a;border-style:solid}
.obtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid #3a3420;padding-top:8px}
.obtns>span{color:#bfb48a}
#optpanel details{border-top:1px solid #3a3420;padding-top:6px;margin-top:8px}
#optpanel summary{cursor:pointer;color:#ffd84a}
#optpanel details ul{margin:6px 0 0;padding-left:18px;line-height:1.45;color:#e8e0bc}
#optpanel details li{margin:3px 0}
#optpanel code{font:11.5px var(--mono);background:#26220f;padding:0 4px;border-radius:2px;color:#fff}
#app{display:grid;grid-template:auto auto auto minmax(0,1fr) auto / minmax(0,1fr);min-height:0;min-width:0;position:relative}
#title{grid-row:1}#ribbon{grid-row:2}#tabs{grid-row:3}#work{grid-row:4}#status{grid-row:5}

/* title bar */
#title{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;background:var(--frame);border-bottom:1px solid #121821;min-width:0}
#title .mark{width:20px;height:20px;flex:none}
#title .name{font-weight:600}
#title .file{flex:1;text-align:left;padding-left:6px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qa{background:none;border:1px solid transparent;border-radius:3px;padding:3px 7px;display:flex;align-items:center;gap:5px;color:var(--text);white-space:nowrap}
.qa:hover:not(:disabled){background:#333c49;border-color:var(--edge)}
.qa:disabled{opacity:.42}
#toolsbtn{display:none}
.pills{display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden}
.pill{border:1px solid #4f5a6a;background:#2a323e;border-radius:11px;padding:1px 9px;white-space:nowrap;color:var(--dim);font-size:12px}
.pill.past{border-color:var(--past);background:#4a3a22;color:#ffe2b8;font-weight:600}
.btn{background:#3a4250;border:1px solid #5a6577;border-radius:3px;padding:4px 12px;white-space:nowrap}
.btn:hover:not(:disabled){background:#4a5567}
.btn:disabled{opacity:.42}
.btn.primary{background:#1f6fc9;border-color:#3d8fe8;font-weight:600}
.btn.primary:hover:not(:disabled){background:#2a7fdc}
.btn.primary.blocked{background:#2b4566;border-color:#3f5f86;color:#c8d6e8}
.btn.sm{padding:2px 9px;font-size:12px}
.btn.danger{border-color:#8a3434;color:#ffc4c4}
.btn.warn{background:#7a5410;border-color:#c98a1c;color:#fff;font-weight:600}
.btn.warn:hover{background:#8d6216}

/* ribbon */
#ribbon{display:flex;background:var(--ribbon);border-bottom:1px solid #151b24;padding:0 4px;overflow-x:auto;scrollbar-width:none}
.panel{display:flex;flex-direction:column;border-right:1px solid var(--edge);flex:none}
.panel .row{display:flex;gap:2px;flex:1;align-items:center;padding:5px 6px 3px}
.panel h3{margin:0;padding:2px 8px 3px;text-align:center;font-size:11px;font-weight:400;color:var(--dim);background:var(--strip);display:flex;justify-content:center;align-items:center;gap:6px}
.rb{display:grid;justify-items:center;gap:3px;min-width:60px;padding:6px 6px 4px;border:1px solid transparent;border-radius:3px;background:none;font-size:12px;color:#dfe5ec;position:relative}
.rb svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rb .pt{fill:var(--blue);stroke:none}
.rb:hover{background:#414a5a;border-color:#56627a}
.rb.on{background:#274b76;border-color:var(--blue);color:#fff}
.layerbox{display:grid;gap:5px;min-width:210px}
.layerbox .lay{display:flex;align-items:center;gap:6px;background:#2b323d;border:1px solid var(--edge);border-radius:3px;padding:0 0 0 8px;position:relative}
.layerbox .sw{width:13px;height:13px;border:1px solid #111;flex:none}
.layerbox select{flex:1;min-width:0;background:transparent;border:0;padding:4px 6px 4px 0;color:var(--text);appearance:auto}
.layerbox select:disabled{opacity:1;color:var(--text)}
.layerbox select option{background:#2b323d}
.layerbox small{color:var(--dim);font-size:11px}
.panel.foldonly{display:none}
.tog2{background:#2b323d;border:1px solid var(--edge);border-radius:3px;padding:6px 10px;color:#7f8a98}
.tog2[aria-pressed=true]{color:#7fc0ff;border-color:#3d6c9e}

/* a tab for each sheet */
#tabs{display:flex;align-items:flex-end;gap:1px;background:#2a313c;padding:3px 6px 0;border-bottom:1px solid #151b24;overflow-x:auto;scrollbar-width:none}
.tab{background:#333b47;border:1px solid #454e5c;border-bottom:0;border-radius:3px 3px 0 0;padding:4px 12px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:#fff}
.tab.on{background:var(--canvas);color:#fff;border-color:#5a6577}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.info{background:var(--blue)}.dot.bad{background:var(--bad)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}

/* the work area */
#work{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0;position:relative}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--canvas)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;cursor:none}
#cv.grabbing{cursor:grabbing}
#zoom{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:grid;gap:1px;z-index:3;background:#3a4250;border:1px solid #5a6577;border-radius:4px;overflow:hidden}
#zoom button{width:34px;height:32px;background:none;border:0;font-size:17px;line-height:1}
#zoom button:hover{background:#4a5567}
#zoom .fit{font-size:11px}
#toast{position:absolute;left:12px;top:12px;z-index:6;display:flex;gap:10px;align-items:flex-start;max-width:min(520px,calc(100% - 70px));padding:8px 10px 8px 12px;border-radius:4px;background:rgba(48,56,69,.97);border:1px solid #5a6577;border-left:3px solid var(--blue);box-shadow:0 6px 18px rgba(0,0,0,.4);animation:tin .2s ease-out}
#toast.ok{border-left-color:var(--ok)}#toast.bad{border-left-color:var(--bad)}#toast.warn{border-left-color:var(--warn)}
#toast b{display:block}#toast small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
#toast .tx{flex:1;min-width:0}
#toast .acts{display:flex;flex-direction:column;gap:4px}
pre.cs{margin:6px 0 0;padding:6px 8px;background:#1b2129;border:1px solid #3c4553;border-radius:3px;font:11px/1.4 var(--mono);color:#cfe3ff;white-space:pre-wrap;overflow-wrap:anywhere;max-height:190px;overflow:auto}
pre.cs .k{color:#9fe6bd}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#note{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:5;max-width:min(440px,calc(100% - 32px));padding:12px 14px;border-radius:5px;background:#3a2a24;border:1px solid #8a5a3a;color:#ffd9c2}

/* the Text tool's box (one of the Text choices) */
#tbox{position:absolute;z-index:7;width:290px;background:rgba(48,56,69,.98);border:1px solid #6a7689;border-radius:5px;box-shadow:0 8px 22px rgba(0,0,0,.5);padding:8px 10px}
#tbox label{display:grid;gap:3px;font-size:11px;color:var(--dim);margin-bottom:6px}
#tbox input{background:#1b2129;border:1px solid #5a6577;border-radius:3px;padding:5px 7px;color:#fff;font-size:14px;width:100%}
#tbox .two{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:end}
#tbox .acts{display:flex;gap:6px;justify-content:flex-end}

/* quick properties */
#qp{position:absolute;z-index:4;width:268px;max-height:calc(100% - 90px);display:flex;flex-direction:column;background:rgba(48,56,69,.97);border:1px solid #5a6577;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#qp header{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;background:var(--strip);border-bottom:1px solid var(--edge);border-radius:4px 4px 0 0}
#qp header b{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qp header button{background:none;border:0;color:var(--dim);font-size:15px;line-height:1;padding:2px 6px}
#qp header button:hover{color:#fff}
#qp .body{padding:6px 10px 8px;overflow:auto}
#qp .acts{display:flex;gap:6px;padding:6px 10px 8px;border-top:1px solid var(--edge)}
.prow{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;padding:2px 0}
.prow span{color:var(--dim)}
.prow output{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.prow output.tmpl{color:#ffd28a;font-family:var(--ui)}
#qp h5{margin:8px 0 3px;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
#qp{width:300px;z-index:5}
body.ined-open #qp{visibility:hidden}
#qp header .qptype{color:var(--dim);font-size:11px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
#qp .acts{align-items:center}
#qp .acts .grow{flex:1}
#qp .acts .pend{font-size:11px;color:#ffd28a}
.prow.ed{grid-template-columns:78px minmax(0,1fr);align-items:center;padding:2px 0}
.prow.ed label{color:var(--dim);display:flex;flex-direction:column;gap:1px;line-height:1.15;overflow-wrap:anywhere}
.prow.ed input,.prow.ed select,.prow.ed textarea{width:100%;min-width:0;background:#1b2129;border:1px solid #4b5464;border-radius:3px;padding:3px 6px;color:#fff;font:12px var(--mono)}
.prow.ed select{font-family:var(--ui);padding:2px 4px}
.prow.ed textarea{resize:vertical;font-size:11px;line-height:1.35}
.prow.ed input:hover:not(:disabled),.prow.ed select:hover:not(:disabled),.prow.ed textarea:hover:not(:disabled){border-color:#6a7689}
.prow.ed input:focus,.prow.ed select:focus,.prow.ed textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(74,163,255,.25)}
.prow.ed :disabled{opacity:.6;background:transparent;border-color:transparent}
.prow.ed.dirty input,.prow.ed.dirty select,.prow.ed.dirty textarea{border-color:#c98a1c;background:#2e2717}
.prow.ed.dirty label::after{content:"edited";font-size:10px;color:#ffd28a}
.fb{display:inline-block;width:max-content;font:10px var(--ui);padding:0 5px;border-radius:7px;margin-top:1px}
.fb.t{background:#4a3a1a;color:#ffd28a;border:1px solid #7a5a22}
.fb.r{background:#1d3550;color:#a9cdf5;border:1px solid #2f557e}
.fnote{grid-column:1/-1;font:11px/1.35 var(--ui);padding:4px 7px;border-radius:3px;margin:2px 0 3px}
.fnote.t{background:rgba(74,54,18,.9);border:1px solid #8a6218;color:#ffe2b0}
.fnote.r{background:#20303f;border:1px solid #2f4b66;color:#c8def5}
.fnote.e{background:#3a2020;border:1px solid #8a3434;color:#ffc4c4}
#ined{position:absolute;z-index:8;background:rgba(27,33,41,.98);border:1px solid var(--blue);border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.5);padding:6px}
#ined input,#ined textarea{display:block;width:100%;background:#212830;border:1px dashed #6a7689;border-radius:2px;color:#eef1f4;font-family:"Segoe UI",Arial,sans-serif;font-weight:300;padding:2px 5px;outline:none;resize:vertical}
#ined .fnote{margin:5px 0 0}
#ined .inhelp{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:4px;font:11px var(--ui);color:var(--dim)}
.dialog.eatt{width:min(560px,100%)}
.dialog h3 small{font-weight:400;color:var(--dim);font-size:12px}
.eatt-list{border:1px solid #4b5464;border-radius:3px;max-height:260px;overflow:auto;background:#252c36}
.eatt-list .eh,.eatt-list .er{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1.2fr);gap:8px;padding:4px 8px;text-align:left;width:100%}
.eatt-list .eh{position:sticky;top:0;background:#353e4b;color:var(--dim);font-size:11px}
.eatt-list .er{background:none;border:0;border-top:1px solid #313a46;font-size:12px}
.eatt-list .er span:first-child{font-family:var(--mono);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.eatt-list .er span:last-child{font-family:var(--mono);overflow-wrap:anywhere}
.eatt-list .er.on{background:#274b76}
.eatt-list .er.dirty span:last-child{color:#ffd28a}
.eav{display:grid;gap:3px;margin-top:10px;font-size:12px;color:var(--dim)}
.eav input{background:#1b2129;border:1px solid #5a6577;border-radius:3px;padding:6px 8px;color:#fff;font:14px var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#2a313c;border:1px solid #5a6577;border-radius:10px;padding:1px 8px;font-size:12px;text-align:left}
.chip:hover{border-color:var(--blue)}
.muted{color:var(--dim)}

/* the command bar */
#cmd{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(820px,calc(100% - 24px));z-index:4;font:13px var(--mono)}
#hist{padding:0 12px 4px;color:#aeb8c4;text-shadow:0 1px 3px #000,0 0 6px #212830;pointer-events:none}
#hist div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdwarn{display:flex;align-items:flex-start;gap:8px;margin:0 0 4px;padding:6px 10px;background:rgba(74,54,18,.97);border:1px solid #c98a1c;border-radius:4px;color:#ffe2b0;font:13px var(--ui);box-shadow:0 4px 14px rgba(0,0,0,.45)}
#cmdwarn b{color:#fff}
#cmdwarn .x{margin-left:auto;background:none;border:0;color:#ffe2b0;font-size:15px;line-height:1;padding:0 4px}
#cmdbar{display:flex;align-items:center;gap:4px 8px;background:rgba(58,66,80,.97);border:1px solid #6a7689;border-radius:4px;padding:5px 10px;box-shadow:0 4px 14px rgba(0,0,0,.45);min-height:34px}
#cmdbar .chev{color:var(--dim);flex:none}
#cmdline{flex:1 1 auto;min-width:0;white-space:normal;line-height:1.5}
#cmdname{font-weight:700;color:#fff;margin-right:6px}
.laytag{color:#9fd0ff;margin-right:6px}
.snapw{color:var(--snap);font-weight:600}
.opt{background:none;border:0;color:#7fc0ff;padding:0 1px;text-decoration:underline;font:inherit}
.opt:hover{color:#fff}
#cmdin{flex:0 0 150px;min-width:0;background:transparent;border:0;border-bottom:1px solid #6a7689;color:#fff;font:13px var(--mono);padding:2px 2px;outline:none}
#cmdin:focus{border-bottom-color:var(--blue)}
#kbd{display:none}
#cmdnote{color:#7f8a98;font:11px var(--ui);white-space:nowrap;flex:none}

/* status bar */
#status{display:flex;align-items:stretch;gap:2px;height:28px;padding:0 6px;background:var(--frame);border-top:1px solid #121821;font-size:12px;color:var(--dim);min-width:0}
#coords{font-family:var(--mono);align-self:center;min-width:250px;padding-left:10px;color:var(--text);white-space:nowrap}
#coords .snapw{font-family:var(--ui);font-weight:400;margin-left:8px}
#paperlabel{align-self:center;padding:0 10px;white-space:nowrap}
.tog{background:none;border:0;padding:0 9px;color:#7f8a98;white-space:nowrap}
.tog[aria-pressed=true]{color:#7fc0ff}
.tog:hover{background:#2c3440}
.tog kbd{font:10px var(--mono);opacity:.7;margin-left:3px}
.osgroup{display:flex;align-items:stretch}
.osgroup .tog[data-tog=osnap]{padding-right:4px}
#osmenubtn{background:none;border:0;padding:0 7px;color:#7f8a98;font-size:10px}
#osmenubtn:hover,#osmenubtn[aria-expanded=true]{background:#2c3440;color:#fff}
.grow{flex:1}
.live{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:0 8px}
.live i{width:8px;height:8px;border-radius:50%;background:#6b7584;flex:none}
.live.open i{background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,132,.18)}
.live.past i{background:var(--past)}

/* the object snap menu */
#osmenu{position:fixed;z-index:35;width:330px;background:#2f3743;border:1px solid #5a6577;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.6);padding:8px 0 6px;font-size:13px}
#osmenu header{display:flex;align-items:center;gap:8px;padding:0 12px 6px;border-bottom:1px solid #3c4553}
#osmenu header b{flex:1}
#osmenu .sw2{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--edge);border-radius:12px;padding:1px 9px 1px 4px;font-size:12px;color:var(--dim)}
#osmenu .sw2 i{width:22px;height:12px;border-radius:6px;background:#4b5464;position:relative}
#osmenu .sw2 i::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:#c8d0da;transition:left .15s}
#osmenu .sw2[aria-checked=true]{color:#7fc0ff;border-color:#3d6c9e}
#osmenu .sw2[aria-checked=true] i{background:#1f6fc9}
#osmenu .sw2[aria-checked=true] i::after{left:12px;background:#fff}
#osmenu ul{list-style:none;margin:0;padding:4px 0}

/* build 6: a change set drawn before it lands */

/* ───────────── build 8: the assistant ───────────── */
// In the app the page starts the drafter's own agent, Claude Code or Codex, with agentdrafter mcp as its MCP server,
// passes the chat to it through a small adapter for its command line, and tells the core what the drafter is looking
// at, which the agent reads with looking-at. None of that runs here: the replies are scripted, and the commands faked.
const SET='examples/demo-plant';
const AGENTS={claude:{name:'Claude Code',cmd:'claude'},codex:{name:'Codex',cmd:'codex'}};
const hasAgent=k=>S.found==='both'||S.found===k;
function agentState(){
  if(OPT.q3==='A2'){const c=(S.cmdText||'').trim();if(!c)return {ok:false,setup:true};
    const w=c.split(/\s+/)[0].split(/[\\/]/).pop().replace(/\.exe$/i,''),k=Object.keys(AGENTS).find(k=>AGENTS[k].cmd===w);
    return {ok:true,name:k?AGENTS[k].name:w,cmd:c}}
  if(OPT.q3==='A1')return hasAgent('claude')?{ok:true,name:'Claude Code',cmd:'claude'}:{ok:false,only:true};
  const c=hasAgent('claude'),x=hasAgent('codex');if(!c&&!x)return {ok:false};
  const k=c&&x?S.agent:c?'claude':'codex';return {ok:true,name:AGENTS[k].name,cmd:AGENTS[k].cmd,picker:c&&x,k}}
function agentStarted(again){const a=agentState();if(!a.ok)return;
  S.chat.push({kind:'sys',at:new Date(),html:`${again?'Now on':'On'} <b>${esc(a.name)}</b>: AgentDrafter started <code>${esc(a.cmd)}</code> and pointed it at <code>agentdrafter mcp</code>, on ${SET}.${again?' A new conversation.':''}`})}
function switchAgent(k){S.agent=k;agentStarted(true);S.stick=true;refresh()}
const proposes=()=>OPT.q4==='R'||(OPT.q4==='A1'&&S.proposeFirst);
function ctxNow(){const i=selIndex(),sh=current();return {sheet:S.sheet,sel:i>=0?[sh.objects[i].id]:[],names:i>=0?[nameIn(sh,i)]:[]}}
// what a message carries of what the drafter is looking at: question 2
function ctxFor(text){if(OPT.q2==='A2')return ctxNow();if(OPT.q2==='R')return S.ctxOff?null:ctxNow();return S.ctxAdd||/\bthis\b/i.test(text)?ctxNow():null}
const ctxWords=c=>`Sheet ${c.sheet} · ${c.sel.length?`1 selected: ${c.names[0]}`:'nothing selected'}`;
const firstLine=w=>{const t=String(w||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');const m=t.match(/^.*?[.!?](?=\s|$)/);return (m?m[0]:t).slice(0,160)};
const fmt=x=>JSON.stringify(x,null,2).replace(/\[\s+([-\d.,\s]+?)\s+\]/g,(m,a)=>'['+a.replace(/\s+/g,' ')+']');
function openChat(focus){S.side='chat';S.stick=true;if(phone()&&S.snap==='peek')setSnap('half');refresh();
  if(focus&&agentState().ok)setTimeout(()=>$('chatin').focus({preventScroll:true}),phone()?300:0)}
// question 5: words from the command bar
function askFromCmd(s){log(`To the assistant: “${s}”`);
  if(OPT.q5!=='A2'){S.side='chat';if(phone()&&S.snap==='peek')setSnap('half')}
  ask(s,'cmd')}
function ask(text,via){
  text=text.trim();if(!text)return;const ag=agentState();
  if(!ag.ok){S.side='chat';if(phone()&&S.snap==='peek')setSnap('half');toast('warn','No agent to ask',ag.setup?'Set your agent’s command first: ⚙ in the panel’s header.':'Install Claude Code or Codex first: the panel says how.');refresh();return}
  if(S.busy){toast('info',`${ag.name} is still working`,'Here it answers one message at a time.');return}
  const ctx=ctxFor(text);S.ctxOff=false;S.ctxAdd=false;
  S.chat.push({kind:'me',at:new Date(),text,ctx,via,q2:OPT.q2});
  const m={kind:'ai',at:new Date(),agent:ag.name,steps:[],words:'',pending:true,via};S.chat.push(m);S.busy=true;S.stick=true;
  if(phone()){$('chatin').blur();if(!(via==='cmd'&&OPT.q5==='A2')&&S.snap!=='half')setSnap('half')}
  refresh();
  const plan=think(text,ctx);let k=0;
  const next=()=>{
    if(k<plan.steps.length){const st=plan.steps[k++];if(st.run)Object.assign(st,st.run());m.steps.push(st);if(st.prop)m.prop=st.prop;if(st.change)m.change=st.change;
      S.stick=true;refresh();if(st.prop||st.change)showMade(st);setTimeout(next,420);return}
    m.words=typeof plan.words==='function'?plan.words(m):plan.words;m.pending=false;S.busy=false;S.stick=true;
    if(via==='cmd'&&OPT.q5==='A2'){S.areply={who:m.agent,text:firstLine(m.words)};log(`${m.agent}: ${firstLine(m.words)}`)}
    refresh()};
  setTimeout(next,560)}
// what it made, brought into sight on the drawing (on a phone, above the open sheet)
function showMade(st){if(!st.sheets?.includes(S.sheet)||S.at!==null)return;let box=null;
  if(st.prop){const p=P.find(x=>x.n===st.prop),r=p&&statusOf(p).v[S.sheet];if(r)box=changeBox(r,.6)}
  else if(st.change){const sh=current(),i=sh.objects.findIndex(o=>!o.gone&&o.id===st.target),b=i>=0?objBox(sh,i):null;if(b)box=[b[0]-1.5,b[1]-1,b[2]+1.5,b[3]+1]}
  if(!box)return;
  if(phone()){fit();fitTo(box,fitK*3);touched=true}
  else{const ok=sx(box[0])>=0&&sx(box[2])<=cw-56&&sy(box[3])>=0&&sy(box[1])<=ch-covered();if(!ok){touched=false;fit()}}
  draw()}
const DIRS={right:[1,0],left:[-1,0],up:[0,1],down:[0,-1]};
function parseMove(t){
  let m=t.match(/\bmove\b(?:\s+(?:this|it|that|these|them))?\s+(?:by\s+)?(-?\d*\.?\d+)\s*(mm|millimet(?:er|re)s?|in|inch(?:es)?|")?\s*(?:to\s+the\s+|towards?\s+the\s+)?(right|left|up|down)\b/i);
  if(m)return {d:+m[1],mm:!!m[2]&&/^m/i.test(m[2]),dir:m[3].toLowerCase()};
  m=t.match(/\bmove\b(?:\s+(?:this|it|that))?\s+(?:to\s+the\s+)?(right|left|up|down)\s+(?:by\s+)?(-?\d*\.?\d+)\s*(mm|in|inch(?:es)?|")?/i);
  if(m)return {d:+m[2],mm:!!m[3]&&/^m/i.test(m[3]),dir:m[1].toLowerCase()};
  return null}
function insPoint(sh,i){const s=sh.snaps.find(s=>s.o===i&&s.k==='insertion');if(s)return {x:s.x,y:s.y};const b=objBox(sh,i);return b?{x:(b[0]+b[2])/2,y:(b[1]+b[3])/2}:{x:0,y:0}}
const attrsOf=o=>o.attrs?o.attrs.map(a=>[a.t,a.v]):(o.attributes||[]).map(a=>[a.tag,a.value]);
const lookStep=c=>({cmd:'looking-at',words:ctxWords(c),input:{source:SET},
  reply:{ok:true,result:{sheet:c.sheet,selected:c.sel,message:`${c.sheet} is open, with ${c.sel.length?`${c.sel[0]} selected`:'nothing selected'}`}}});
function queryStep(sh,i){const o=sh.objects[i],at=insPoint(sh,i),b=objBox(sh,i),obj={sheet:sh.sheet,id:o.id,type:o.type,layer:o.layer};
  if(o.name)obj.name=o.name;if(o.block)obj.block=o.block;obj.at=[r4(at.x),r4(at.y)];if(b)obj.extents=[[r4(b[0]),r4(b[1])],[r4(b[2]),r4(b[3])]];
  const a=attrsOf(o);if(a.length)obj.attributes=Object.fromEntries(a);if(o.text)obj.text=o.text.c;
  obj.from=o.from==='template'?{template:TEMPLATE_OF(sh.sheet),sheets:SHEETS_OF(TEMPLATE_OF(sh.sheet)).length}:'row';
  return {cmd:'query',words:`find ${o.id}: ${typeWords(o).toLowerCase()}, on layer ${o.layer}`,input:{query:'find',source:SET,id:o.id},reply:{ok:true,result:{kind:'find',count:1,objects:[obj]}}}}
function describe(sh,i){const o=sh.objects[i],name=nameIn(sh,i),at=insPoint(sh,i),b=objBox(sh,i);
  let w=`<b>${esc(name)}</b> is `;
  if(o.block)w+=`an insert of the block ${esc(o.block)}, on layer ${esc(o.layer)}, at ${f3(at.x)}, ${f3(at.y)} in.`;
  else if(isText(o)&&o.text)w+=`${o.type==='mtext'?'a multiline text':'a text'} on layer ${esc(o.layer)}, ${o.text.h} in high: “${esc(o.text.c.split('\n')[0])}”${o.text.c.includes('\n')?' and more':''}.`;
  else w+=`a ${esc(o.type)} on layer ${esc(o.layer)}${b?`, ${f3(b[2]-b[0])} × ${f3(b[3]-b[1])} in`:''}.`;
  const a=attrsOf(o).filter(([,v])=>v!=='');if(a.length)w+=` Its attributes: ${a.slice(0,5).map(([t,v])=>`${esc(t)} ${esc(v)}`).join(', ')}${a.length>5?`, and ${a.length-5} more`:''}.`;
  if(o.text&&o.text.k)w+=` Its words come from the row’s ${esc(o.text.k)}.`;
  if(o.from==='template'){const t=TEMPLATE_OF(sh.sheet),n=SHEETS_OF(t).length;w+=` It comes from the template ${tname(t)}${n>1?`, which ${n} sheets are built from: an edit to it changes all ${n}`:''}.`}
  else w+=` It is ${sh.sheet}’s own, in its row: an edit to it changes this sheet only.`;
  if(lockedLayers().has(o.layer)){const by=lockedBy(o.layer);w+=` Its layer is locked${by?` (change set ${by.n})`:''}, so it can’t be edited until it is unlocked.`}
  return w}
function refusedWords(r){const by=r.code==='locked'?lockedBy(r.layer):null;return r.code==='locked'?`layer ${esc(r.layer)} is locked${by?` (change set ${by.n})`:''}`:esc(r.tag)}
// the scripted replies: "move this N to the right" and "what is this?"; anything else is canned
function think(text,ctx){
  const mv=parseMove(text),what=/\bwhat(?:'s|’s|\s+is)\s+(?:this|that|it|selected)\b/i.test(text)||/^\s*(?:describe|explain)\s+(?:this|that|it)\b/i.test(text);
  if(!mv&&!what)return {steps:[],words:`(prototype) This assistant is scripted. Here it knows two things: <b>move this 10 to the right</b> and <b>what is this?</b>, with an object selected. Your own agent answers anything, through the same commands.`};
  if(!ctx)return {steps:[],words:OPT.q2==='A1'?'I wasn’t told what you’re looking at, so I don’t know what you mean. Press <b>+ Selection</b>, or say “this”, and ask again.'
    :'That message didn’t carry what you’re looking at (the chip was off), so I don’t know what you mean. Ask again with it on.'};
  const sh=sheetAt(ctx.sheet,null),look=lookStep(ctx);
  if(!ctx.sel.length){
    if(what){const t=TEMPLATE_OF(ctx.sheet),n=SHEETS_OF(t).length;
      return {steps:[look],words:`You’re looking at <b>${ctx.sheet}</b>, “${esc(PR[ctx.sheet].values.TITLE)}”, ${sh.paper.name}, built from the template ${tname(t)}${n>1?` with ${n-1} other sheets`:''}. Nothing is selected: click an object and ask again, and I’ll say what it is.`}}
    return {steps:[look],words:`Nothing is selected on ${ctx.sheet}, so I don’t know what to move. Click it, then ask again.`}}
  const i=sh.objects.findIndex(o=>!o.gone&&o.id===ctx.sel[0]);if(i<0)return {steps:[look],words:'I can’t find what you selected any more.'};
  const o=sh.objects[i],name=nameIn(sh,i),q=queryStep(sh,i);
  if(what)return {steps:[look,q],words:describe(sh,i)};
  const d=mv.mm?mv.d/25.4:mv.d,[ux,uy]=DIRS[mv.dir],dx=r4(ux*d),dy=r4(uy*d);
  const at=insPoint(sh,i),tail=tailOf(o.id),sheets=o.from==='template'?SHEETS_OF(TEMPLATE_OF(ctx.sheet)):[ctx.sheet];
  const ops=[{op:'move',target:{id:o.id},from:[r4(at.x),r4(at.y),0],to:[r4(at.x+dx),r4(at.y+dy),0]}],eff=[{kind:'move',sheets,tail,by:[dx,dy]}];
  const dist=`${mv.mm?`${mv.d} mm (${f3(Math.abs(d))} in)`:`${r4(Math.abs(d))} in`} ${mv.dir==='up'||mv.dir==='down'?mv.dir:'to the '+mv.dir}`;
  const where=sheets.length>1?`, on all ${sheets.length} sheets built from ${tname(TEMPLATE_OF(ctx.sheet))}, since it comes from the template`:'';
  if(proposes()){
    const st={cmd:'propose',input:{source:SET,by:'Assistant',operations:ops},sheets,run:()=>{
      const n=pnext++,p={n,by:'Assistant',at:new Date(),after:newest(),title:`move ${tail}`,verb:'Move',obj:name,ops,eff,sheets};
      P.push(p);MADE.set(n,p);log(`Proposal ${n} from Assistant: Move ${name}`);
      return {prop:n,words:`· Move ${name}, ${dist} → proposal ${n}`,reply:{ok:true,result:{proposal:n,by:'Assistant',sheets,message:`proposal ${n} waits: nothing changes until it is kept`}}}}};
    return {steps:[look,q,st],words:m=>{const p=MADE.get(m.prop),s=statusOf(p);
      let w=`Proposed: move <b>${esc(name)}</b> ${dist}${where}. It’s dashed on the drawing as proposal ${m.prop}; nothing changes until you keep it.`;
      if(s.bad.length)w+=` It can’t land as the set stands: ${refusedWords(s.v[s.bad[0]])}. Unlock it first, or discard it.`;
      else if(s.fails.length)w+=` It would land, but ${listed(s.fails)} would then fail a check: ${esc(s.v[s.fails[0]].checks[0].words)}`;
      return w}}}
  const st={cmd:'change',input:{source:SET,operations:ops},sheets,target:o.id,run:()=>{
    const pv=previewOf({sheets,eff,ops});
    if(pv.bad.length){const r=pv.v[pv.bad[0]];return {bad:true,refused:r,words:`· Move ${name}: refused (${r.code})`,reply:{ok:false,error:{code:r.code,message:r.why}}}}
    land(ops,eff,sheets,`Moved ${name}`,{via:'MCP server',byAgent:'Assistant',title:`Move ${name}`,keep:true});const n=newest();
    return {change:n,words:`· Move ${name}, ${dist} → change set ${n}`,reply:{ok:true,result:{change_set:n,landed:sheets}}}}};
  return {steps:[look,q,st],words:m=>{const s=m.steps.at(-1);
    if(s.bad)return `I couldn’t move <b>${esc(name)}</b>: the core refused it, as ${refusedWords(s.refused)}. Nothing changed.`;
    return `Moved <b>${esc(name)}</b> ${dist}${where}: change set ${s.change}, in the journal. Undo takes it back.`}}}

/* a phone's bottom sheet: the panel */
function room(){return $('work').clientHeight}
function peekH(){const pk=$('peek');if(phone()&&!pk.hidden&&pk.offsetHeight)S.peekPx=$('grab').offsetHeight+pk.offsetHeight;return S.peekPx||170}

  const y=top??snapY(S.snap);el.style.transition=animate?'top .28s cubic-bezier(.2,.8,.2,1)':'none';el.style.top=y+'px';
  const p=peekH();if(Math.abs(S_peek()-p)>.5){document.documentElement.style.setProperty('--peek',p+'px');if(!touched)fit()}}

{let d=null;const el=$('side');

    if(Math.abs(e.clientY-d.y0)>6)d.moved=true;d.y=Math.max(snapY('full'),Math.min(snapY('peek'),d.s0+e.clientY-d.y0));placeSheet(false,d.y)});

    if(!x.moved){if(x.tap){setSnap(S.snap==='peek'?'half':'peek');refresh()}return}
