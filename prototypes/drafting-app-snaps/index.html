<!doctype html>
<!--
  PROTOTYPE, throwaway. Issue #151: object snaps, the crosshair and snap markers (build 3 of 10),
  with a labelled preview of how build 4's Line will use them. It starts from the frame Zach picked
  (prototype/drafting-app-frame-150), restyled where the real build changed it.
  The drawings are the demo plant's real display lists and its real snap points from `query snap`
  (demo-plant.js). Perpendicular, Tangent, Nearest and the snaps of lines drawn in the preview are
  worked out in this page. The journal is faked. Nothing here is production code.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>AgentDrafter, object snaps (prototype)</title>
<style>
:root{--frame:#1e2530;--ribbon:#394150;--strip:#303845;--edge:#4b5464;--canvas:#212830;--text:#e6e9ee;--dim:#a3adba;--blue:#4aa3ff;
  --ok:#3ddc84;--warn:#ffb020;--bad:#ff5d5d;--past:#e0a85a;--snap:#f2e24b;
  --ui:"Segoe UI",system-ui,-apple-system,sans-serif;--mono:Consolas,"Cascadia Mono",ui-monospace,Menlo,monospace;--peek:0px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font:13px/1.35 var(--ui);color:var(--text);background:var(--frame);display:grid;grid-template:auto minmax(0,1fr) / minmax(0,1fr);height:100dvh;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
svg{display:block}

/* the prototype's own strip: which demo, outside the product */
#proto{display:flex;align-items:center;gap:8px;padding:3px 8px;background:#000;color:#ffd84a;font-size:12px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#proto button{background:#000;border:1px solid #ffd84a;color:#ffd84a;border-radius:3px;padding:1px 8px;font-size:12px}
#proto .mode[aria-pressed=true]{background:#ffd84a;color:#000;font-weight:600}
#app{display:grid;grid-template:auto auto auto minmax(0,1fr) auto / minmax(0,1fr);min-height:0;min-width:0;position:relative}
#title{grid-row:1}#ribbon{grid-row:2}#tabs{grid-row:3}#work{grid-row:4}#status{grid-row:5}

/* title bar */
#title{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;background:var(--frame);border-bottom:1px solid #121821;min-width:0}
#title .mark{width:20px;height:20px;flex:none}
#title .name{font-weight:600}
#title .file{flex:1;text-align:center;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qa{background:none;border:1px solid transparent;border-radius:3px;padding:3px 7px;display:flex;align-items:center;gap:5px;color:var(--text);white-space:nowrap}
.qa:hover:not(:disabled){background:#333c49;border-color:var(--edge)}
.qa:disabled{opacity:.42}
#toolsbtn{display:none}
.pills{display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden}
.pill{border:1px solid #4f5a6a;background:#2a323e;border-radius:11px;padding:1px 9px;white-space:nowrap;color:var(--dim);font-size:12px}
.pill.past{border-color:var(--past);background:#4a3a22;color:#ffe2b8;font-weight:600}
.btn{background:#3a4250;border:1px solid #5a6577;border-radius:3px;padding:4px 12px;white-space:nowrap}
.btn:hover:not(:disabled){background:#4a5567}
.btn:disabled{opacity:.42}
.btn.primary{background:#1f6fc9;border-color:#3d8fe8;font-weight:600}
.btn.primary:hover:not(:disabled){background:#2a7fdc}
.btn.primary.blocked{background:#2b4566;border-color:#3f5f86;color:#c8d6e8}
.btn.sm{padding:2px 9px;font-size:12px}
.btn.danger{border-color:#8a3434;color:#ffc4c4}

/* ribbon */
#ribbon{display:flex;background:var(--ribbon);border-bottom:1px solid #151b24;padding:0 4px;overflow-x:auto;scrollbar-width:none}
.panel{display:flex;flex-direction:column;border-right:1px solid var(--edge);flex:none}
.panel .row{display:flex;gap:2px;flex:1;align-items:center;padding:5px 6px 3px}
.panel h3{margin:0;padding:2px 8px 3px;text-align:center;font-size:11px;font-weight:400;color:var(--dim);background:var(--strip);display:flex;justify-content:center;align-items:center;gap:6px}
.soon{font-size:10px;line-height:1;padding:2px 5px;border-radius:7px;background:#4b5464;color:#dfe5ec;letter-spacing:.02em}
.rb{display:grid;justify-items:center;gap:3px;min-width:60px;padding:6px 6px 4px;border:1px solid transparent;border-radius:3px;background:none;font-size:12px;color:#c2cad4;position:relative}
.rb svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.rb .pt{fill:var(--blue);stroke:none}
.rb:hover{background:#414a5a;border-color:#56627a}
.rb.flash{border-color:var(--blue);background:#2d3d55}
.rb.on{background:#274b76;border-color:var(--blue);color:#fff}
.rb.on svg{opacity:1}
.rb .pv{position:absolute;top:-1px;right:-2px;font-size:9px;line-height:1;padding:2px 4px;border-radius:6px;background:#ffd84a;color:#000;font-weight:700}
.layerbox{display:grid;gap:5px;min-width:200px}
.layerbox .lay{display:flex;align-items:center;gap:6px;background:#2b323d;border:1px solid var(--edge);border-radius:3px;padding:4px 8px;cursor:default}
.layerbox .sw{width:13px;height:13px;border:1px solid #111;flex:none}
.layerbox .ln{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layerbox .ln.muted{color:var(--dim)}
.layerbox .caret{opacity:.35}
.layerbox small{color:var(--dim);font-size:11px}
.panel.foldonly{display:none}
.tog2{background:#2b323d;border:1px solid var(--edge);border-radius:3px;padding:6px 10px;color:#7f8a98}
.tog2[aria-pressed=true]{color:#7fc0ff;border-color:#3d6c9e}

/* a tab for each sheet */
#tabs{display:flex;align-items:flex-end;gap:1px;background:#2a313c;padding:3px 6px 0;border-bottom:1px solid #151b24;overflow-x:auto;scrollbar-width:none}
.tab{background:#333b47;border:1px solid #454e5c;border-bottom:0;border-radius:3px 3px 0 0;padding:4px 12px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:#fff}
.tab.on{background:var(--canvas);color:#fff;border-color:#5a6577}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.info{background:var(--blue)}.dot.bad{background:var(--bad)}.dot.ok{background:var(--ok)}

/* the work area */
#work{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0;position:relative}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--canvas)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;cursor:none}
#cv.grabbing{cursor:grabbing}
#zoom{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:grid;gap:1px;z-index:3;background:#3a4250;border:1px solid #5a6577;border-radius:4px;overflow:hidden}
#zoom button{width:34px;height:32px;background:none;border:0;font-size:17px;line-height:1}
#zoom button:hover{background:#4a5567}
#zoom .fit{font-size:11px}
#toast{position:absolute;left:12px;top:12px;z-index:6;display:flex;gap:10px;align-items:flex-start;max-width:min(470px,calc(100% - 70px));padding:8px 10px 8px 12px;border-radius:4px;background:rgba(48,56,69,.97);border:1px solid #5a6577;border-left:3px solid var(--blue);box-shadow:0 6px 18px rgba(0,0,0,.4);animation:tin .2s ease-out}
#toast.ok{border-left-color:var(--ok)}#toast.bad{border-left-color:var(--bad)}#toast.warn{border-left-color:var(--warn)}
#toast b{display:block}#toast small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
#toast .tx{flex:1;min-width:0}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#note{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:5;max-width:min(440px,calc(100% - 32px));padding:12px 14px;border-radius:5px;background:#3a2a24;border:1px solid #8a5a3a;color:#ffd9c2}

/* quick properties */
#qp{position:absolute;z-index:4;width:268px;max-height:calc(100% - 90px);display:flex;flex-direction:column;background:rgba(48,56,69,.97);border:1px solid #5a6577;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#qp header{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;background:var(--strip);border-bottom:1px solid var(--edge);border-radius:4px 4px 0 0}
#qp header b{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qp header button{background:none;border:0;color:var(--dim);font-size:15px;line-height:1;padding:2px 6px}
#qp header button:hover{color:#fff}
#qp .body{padding:6px 10px 8px;overflow:auto}
.prow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;padding:2px 0}
.prow span{color:var(--dim)}
.prow output{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
#qp h5{margin:8px 0 3px;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#2a313c;border:1px solid #5a6577;border-radius:10px;padding:1px 8px;font-size:12px;text-align:left}
.chip:hover{border-color:var(--blue)}
.muted{color:var(--dim)}

/* the command bar */
#cmd{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(780px,calc(100% - 24px));z-index:4;font:13px var(--mono)}
#hist{padding:0 12px 4px;color:#aeb8c4;text-shadow:0 1px 3px #000,0 0 6px #212830;pointer-events:none}
#hist div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdbar{display:flex;align-items:center;gap:4px 8px;background:rgba(58,66,80,.97);border:1px solid #6a7689;border-radius:4px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.45);min-height:32px}
#cmdbar .chev{color:var(--dim);flex:none}
#cmdline{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdname{font-weight:700;color:#fff;margin-right:6px}
.snapw{color:var(--snap);font-weight:600}
.opt{background:none;border:0;color:#7fc0ff;padding:0 1px;text-decoration:underline;font:inherit}
.opt:hover{color:#fff}
#cmdnote{color:#7f8a98;font:11px var(--ui);white-space:nowrap;flex:none}

/* status bar */
#status{display:flex;align-items:stretch;gap:2px;height:28px;padding:0 6px;background:var(--frame);border-top:1px solid #121821;font-size:12px;color:var(--dim);min-width:0}
#coords{font-family:var(--mono);align-self:center;min-width:250px;padding-left:10px;color:var(--text);white-space:nowrap}
#coords .snapw{font-family:var(--ui);font-weight:400;margin-left:8px}
#paperlabel{align-self:center;padding:0 10px;white-space:nowrap}
.tog{background:none;border:0;padding:0 9px;color:#7f8a98;white-space:nowrap}
.tog[aria-pressed=true]{color:#7fc0ff}
.tog:hover{background:#2c3440}
.tog kbd{font:10px var(--mono);opacity:.7;margin-left:3px}
.osgroup{display:flex;align-items:stretch}
.osgroup .tog[data-tog=osnap]{padding-right:4px}
#osmenubtn{background:none;border:0;padding:0 7px;color:#7f8a98;font-size:10px}
#osmenubtn:hover,#osmenubtn[aria-expanded=true]{background:#2c3440;color:#fff}
.grow{flex:1}
.live{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:0 8px}
.live i{width:8px;height:8px;border-radius:50%;background:#6b7584;flex:none}
.live.open i{background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,132,.18)}
.live.past i{background:var(--past)}

/* the object snap menu: which snaps run */
#osmenu{position:fixed;z-index:35;width:330px;background:#2f3743;border:1px solid #5a6577;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.6);padding:8px 0 6px;font-size:13px}
#osmenu header{display:flex;align-items:center;gap:8px;padding:0 12px 6px;border-bottom:1px solid #3c4553}
#osmenu header b{flex:1}
#osmenu .sw2{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--edge);border-radius:12px;padding:1px 9px 1px 4px;font-size:12px;color:var(--dim)}
#osmenu .sw2 i{width:22px;height:12px;border-radius:6px;background:#4b5464;position:relative}
#osmenu .sw2 i::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:#c8d0da;transition:left .15s}
#osmenu .sw2[aria-checked=true]{color:#7fc0ff;border-color:#3d6c9e}
#osmenu .sw2[aria-checked=true] i{background:#1f6fc9}
#osmenu .sw2[aria-checked=true] i::after{left:12px;background:#fff}
#osmenu ul{list-style:none;margin:0;padding:4px 0}
#osmenu li.grp{padding:8px 12px 2px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.osrow{display:grid;grid-template-columns:18px 22px minmax(0,1fr);gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:4px 12px}
.osrow:hover{background:#3a4352}
.osrow .ck{width:15px;height:15px;border:1px solid #6a7689;border-radius:3px;display:grid;place-items:center;font-size:11px;line-height:1;color:#fff}
.osrow[aria-checked=true] .ck{background:#1f6fc9;border-color:#3d8fe8}
.osrow svg{width:22px;height:22px;fill:none;stroke:var(--snap);stroke-width:1.6}
.osrow small{display:block;color:var(--dim);font-size:11px;line-height:1.25}
#osmenu.off .osrow svg{stroke:#7f8a98}
#osmenu footer{display:flex;gap:6px;padding:6px 12px 0;border-top:1px solid #3c4553;align-items:center}
#osmenu footer small{flex:1;color:var(--dim);font-size:11px}

/* the side panel */
#side{display:flex;flex-direction:column;min-height:0;background:#2a313c;border-left:1px solid #121821}
#grab{display:none}
#peek{display:none}
#sidetabs{display:flex;align-items:center;gap:4px;padding:6px 10px 0;border-bottom:1px solid #3c4553}
.stab{background:none;border:0;border-bottom:2px solid transparent;padding:4px 8px 6px;color:var(--dim);display:flex;gap:6px;align-items:center}
.stab.on{color:#fff;border-color:var(--blue)}
#sidebody{flex:1;min-height:0;overflow:auto;padding:8px 10px 14px}
.jhead{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.jhead b{font-size:14px}
.stepper{margin-left:auto;display:flex;align-items:center;gap:2px;font-family:var(--mono);font-size:12px}
.stepper button{background:#3a4250;border:1px solid #5a6577;border-radius:3px;width:28px;height:26px;font-size:16px;line-height:1}
.stepper span{min-width:46px;text-align:center}
.err{color:#ffb0b0}
.jlist{list-style:none;margin:0;padding:0}
.je{border:1px solid transparent;border-radius:4px;margin-bottom:2px}
.je.on{border-color:#4f5a6a;background:#303845}
.je.at{border-color:var(--past);background:#3a3326}
.je-head{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:start;width:100%;text-align:left;background:none;border:0;padding:6px 6px}
.je-n{font-family:var(--mono);color:var(--dim)}
.je-t{display:block}
.je-m{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;margin-top:2px}
.sh-landed{color:#9fe6bd}.sh-failed{color:#ffb0b0}
.badge{font-size:11px;padding:1px 7px;border-radius:9px;white-space:nowrap;border:1px solid #4f5a6a;color:var(--dim)}
.b-landed{border-color:#2c6a46;color:#9fe6bd}.b-issued{border-color:#3d6c9e;color:#a9cdf5}
.b-failed{border-color:#8a3434;color:#ffb0b0}
.b-undone{color:#8f99a6;text-decoration:line-through}.b-undo,.b-accept{color:#c8d0da}
.je-det{padding:0 8px 8px 36px;font-size:12px}
.je-det p{margin:4px 0}
.ops{list-style:none;margin:4px 0;padding:0}
.ops li{display:flex;gap:8px}.ops code{font-family:var(--mono);color:#cfd6df}
.revsep{color:#7f8a98;font-size:11px;text-align:center;padding:8px 0;border-top:1px dashed #3c4553;margin-top:6px}
.assist{padding:14px 6px;color:var(--dim);line-height:1.5}
.assist h4{color:var(--text);margin:0 0 6px;font-size:14px}
.assist .ghost{margin-top:14px;border:1px dashed #4f5a6a;border-radius:6px;padding:10px;color:#7f8a98}

/* the tip that explains a tool */
#tip{position:fixed;z-index:30;width:260px;padding:8px 10px;background:#f4f6f8;color:#1c232d;border-radius:3px;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;line-height:1.4}
#tip b{display:block;margin-bottom:2px}
#tip kbd{font:12px var(--mono);background:#dfe4ea;border-radius:2px;padding:0 4px;margin-left:4px}
#tip .soonline{display:block;margin-top:5px;color:#5a6472;font-size:12px}

#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.dialog{width:min(460px,100%);background:#2f3743;border:1px solid #5a6577;border-radius:6px;padding:16px 18px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.dialog h3{margin:0 0 8px;font-size:16px}
.dialog .ok{color:#9fe6bd}
.dialog-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#stage.past{background:#29251f}

/* a phone */
@media (max-width:860px){
  #title{height:44px;gap:6px}
  #title .name,#title .file,#undo,#accept{display:none}
  #toolsbtn{display:flex;border-color:var(--edge);background:#2a323e}
  body.tools-open #toolsbtn{background:#274b76;border-color:var(--blue)}
  .pills{flex:1;justify-content:flex-end}
  #ribbon{display:none;position:absolute;left:0;right:0;top:44px;z-index:25;flex-wrap:wrap;padding:4px;gap:4px 0;box-shadow:0 14px 30px rgba(0,0,0,.55);border-bottom:2px solid var(--blue)}
  body.tools-open #ribbon{display:flex}
  .panel{border-right:0;flex:1 1 100%}
  .panel .row{flex-wrap:wrap}
  .panel.foldonly{display:flex}
  .rb{min-width:56px;padding:6px 4px 4px}
  .layerbox{min-width:0;flex:1}
  .tab{padding:6px 12px}
  #work{grid-template-columns:minmax(0,1fr)}
  #side{position:absolute;left:0;right:0;bottom:0;top:0;z-index:12;border-left:0;border-top:1px solid #5a6577;border-radius:12px 12px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);will-change:transform}
  #grab{display:block;padding:7px 0 3px;touch-action:none;cursor:grab}
  #grab span{display:block;margin:0 auto;width:40px;height:4px;border-radius:2px;background:#6a7689}
  #peek{display:grid;gap:6px;padding:2px 10px 8px;touch-action:none}
  .peekline{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  .peeklast{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:center;text-align:left;background:#303845;border:1px solid #3c4553;border-radius:4px;padding:6px}
  .peeklast .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .peekacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .peekacts .btn{padding:8px 10px}
  #status{display:none}
  /* Fit sits beside the command bar, as the real frame has it */
  #zoom{top:auto;transform:none;bottom:calc(var(--peek) + 8px);right:8px}
  #zoom .zi{display:none}
  #zoom .fit{height:34px;width:44px}
  #cmd{bottom:calc(var(--peek) + 8px);width:calc(100% - 68px);left:8px;transform:none}
  #cmdbar{min-height:36px}
  #cmdline{white-space:normal;overflow:visible}
  #cmdnote{display:none}
  #hist{display:none}
  #qp{left:8px!important;right:8px;top:auto!important;bottom:calc(var(--peek) + 56px);width:auto;max-height:44%}
  #toast{left:8px;right:8px;max-width:none}
  #osmenu{left:8px!important;right:8px;width:auto;top:auto!important;bottom:8px}
  .osrow{padding:7px 12px}
  #proto .long{display:none}
}
</style>
</head>
<body>
<div id="proto"><span>Prototype: snaps, build 3 of 10</span>
  <button class="mode" data-mode="snaps" aria-pressed="true">Build 3: snaps, no tool</button>
  <button class="mode" data-mode="line" aria-pressed="false">Preview of build 4: Line</button>
  <button id="reset">Start over</button>
  <span class="long" style="opacity:.75">Snap points are the demo plant's own, from <code>query snap</code>; Perpendicular, Tangent, Nearest and the drawn lines' snaps are worked out in this page.</span></div>
<div id="app">
  <header id="title">
    <svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17V4l13 13z" fill="none" stroke="#4aa3ff" stroke-width="2" stroke-linejoin="round"/><path d="M7 14v-3l3 3z" fill="#4aa3ff"/></svg><span class="name">AgentDrafter</span>

<script src="demo-plant.js"></script>
<script>
'use strict';
const DP=window.DEMO_PLANT, $=id=>document.getElementById(id);
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in (props||{})){const v=props[k];
    if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
  for(const c of kids.flat(3)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e}
const put=(el,...k)=>el.replaceChildren(...k.flat(3).filter(x=>x!=null&&x!==false).map(x=>x.nodeType?x:document.createTextNode(String(x))));
const up=s=>s.toUpperCase();
const plural=(n,one,many=one+'s')=>`${n} ${n===1?one:many}`;
const listed=a=>a.length<=1?a.join(''):`${a.slice(0,-1).join(', ')} and ${a.at(-1)}`;
const clock=t=>t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const phone=()=>matchMedia('(max-width:860px)').matches;
const f4=v=>(Math.abs(v)<5e-5?0:v).toFixed(4);

/* ───────────── object snaps: which there are, their AutoCAD marker, and which run by default ───────────── */
// Marker shapes are AutoCAD's AutoSnap markers, as SVG paths round 0,0 with a half size s,
// so the same shape draws on the drawing (Path2D) and in the menu (SVG).
const C=(r,cx=0,cy=0)=>`M${cx+r} ${cy}A${r} ${r} 0 1 0 ${cx-r} ${cy}A${r} ${r} 0 1 0 ${cx+r} ${cy}Z`;
const SNAPS=[
 {k:'endpoint',label:'Endpoint',hint:'The ends of lines, arcs and polyline corners',path:s=>`M${-s} ${-s}H${s}V${s}H${-s}Z`},
 {k:'midpoint',label:'Midpoint',hint:'The middle of a line, an arc or a polyline side',path:s=>`M0 ${-s}L${s} ${s*.8}H${-s}Z`},
 {k:'center',label:'Centre',hint:'The centre of a circle or an arc',path:s=>C(s)},
 {k:'quadrant',label:'Quadrant',hint:'A circle’s 0°, 90°, 180° and 270° points',path:s=>`M0 ${-s}L${s} 0L0 ${s}L${-s} 0Z`},
 {k:'intersection',label:'Intersection',hint:'Where two objects cross',path:s=>`M${-s} ${-s}L${s} ${s}M${s} ${-s}L${-s} ${s}`},
 {k:'insertion',label:'Insertion',hint:'Where a block or a text is placed',path:s=>`M${-s} ${-s*.2}H${s*.2}V${s}H${-s}ZM${-s*.2} ${-s*.2}V${-s}H${s}V${s*.2}H${s*.2}`},
 {k:'node',label:'Node',hint:'Where a text’s baseline starts, and points',path:s=>C(s)+`M${-s*.7} ${-s*.7}L${s*.7} ${s*.7}M${s*.7} ${-s*.7}L${-s*.7} ${s*.7}`},
 {k:'nearest',label:'Nearest',hint:'The nearest point on any object',path:s=>`M${-s} ${-s}H${s}L${-s} ${s}H${s}Z`},
 {k:'perpendicular',label:'Perpendicular',hint:'Square to an object, from the last point',tool:true,path:s=>`M${-s} ${-s}V${s}H${s}M${-s} 0H0V${s}`},
 {k:'tangent',label:'Tangent',hint:'Touching a circle, from the last point',tool:true,path:s=>C(s*.7,0,s*.3)+`M${-s} ${-s*.4}H${s}`}];
const SN=Object.fromEntries(SNAPS.map(x=>[x.k,x]));
// AutoCAD's default running snaps are Endpoint, Centre, Intersection and Extension (OSMODE 4133);
// the core has no Extension, and Midpoint is added: a beginner reaches for the middle of a line first.
const DEFAULT_SNAPS=['endpoint','midpoint','center','intersection'];
// When two snaps are as near, AutoCAD-like order decides.
const PRIO=['endpoint','intersection','midpoint','center','quadrant','insertion','node','perpendicular','tangent','nearest'];
const markerSvg=(k,sz=22)=>`<svg viewBox="-11 -11 22 22" width="${sz}" height="${sz}" aria-hidden="true"><path d="${SN[k].path(7)}"/></svg>`;

/* ───────────── the faked journal (the frame's), so the frame reads as it is ───────────── */
let J=[],jver=0,S;
function seed(){
  const t=m=>new Date(Date.now()-m*60e3);
  J=[
    {n:1,kind:'change_set',via:'command line',at:t(190),landed:['DP-LD-101'],failed:[],ops:[{op:'move',sheet:'DP-LD-101',target:'signal',by:[0,-0.12]}]},
    {n:2,kind:'accept',via:'viewer',at:t(150),issued:[1]},
    {n:3,kind:'change_set',via:'MCP server',at:t(42),landed:['DP-LD-101','DP-LD-102'],failed:[],ops:[
      {op:'add_line',sheet:'DP-LD-101',id:'drain-1',layer:'wire',from:[8.6,5.75],to:[11,5.75]},
      {op:'add_line',sheet:'DP-LD-102',id:'drain-1',layer:'wire',from:[8.6,5.75],to:[11,5.75]}]}];
  J[0].issuedBy=2;
  jver++;
  const mode=new URLSearchParams(location.search).get('mode')==='line'?'line':'snaps';
  S={sheet:'DP-LD-101',at:null,sel:null,focused:null,pulseT:0,grid:true,osnap:true,ortho:false,stream:'open',
     side:'journal',open:new Set(),log:['Journal read: 3 entries. Live: changes show as they land.'],prompt:null,
     snap:'peek',cannot:null,
     // snaps
     kinds:new Set(DEFAULT_SNAPS),mode,cursor:null,hover:null,cands:[],candI:0,taken:null,loupe:null,flash:null,
     line:{pts:[]},drawn:{},menu:false};
}
const entry=n=>J.find(e=>e.n===n);
const newest=()=>J.at(-1)?.n??0;
const canUndo=()=>J.filter(e=>e.kind==='change_set'&&e.landed.length&&!e.undoneBy&&!e.issuedBy).map(e=>e.n);
const lastUndoable=()=>canUndo().at(-1)??null;
const pending=()=>J.filter(e=>e.kind==='change_set'&&e.landed.length&&!e.undoneBy&&!e.issuedBy);
const lastAccept=()=>[...J].reverse().find(e=>e.kind==='accept');
function sheetsTouched(e){if(e.kind==='change_set')return e.landed;if(e.kind==='undo')return [...new Set(e.undid.flatMap(n=>entry(n).landed))];return []}
function changedOn(e,sheet){if(!e||e.kind!=='change_set')return [];return e.ops.filter(o=>o.sheet===sheet&&e.landed.includes(sheet)).map(o=>({id:`${sheet}/${o.op==='add_line'?o.id:o.target}`,how:o.op==='add_line'?'added':'changed'}))}
const viaWords=v=>v==='viewer'?'the viewer':v==='command line'?'the command line':v==='MCP server'?'the MCP server':v==='Python library'?'the Python library':'the HTTP API';
function opWords(o){return o.op==='move'?`move ${o.target} by ${o.by[0]}, ${o.by[1]}`:o.op==='add_line'?`add_line ${o.id} on ${o.layer??'?'}`:o.op}
function entryTitle(e){
  if(e.kind==='undo')return `Undo of change set${e.undid.length>1?'s':''} ${e.undid.join(', ')}`;
  if(e.kind==='accept')return e.issued.length?`Accept: issued change set${e.issued.length>1?'s':''} ${e.issued.join(', ')}`:'Accept: issued the set as it stood';
  const ops=e.ops,first=ops.slice(0,2).map(opWords).join(', ');return first+(ops.length>2?` and ${ops.length-2} more`:'')}
function entryState(e){
  if(e.kind==='undo')return ['undo','Undo'];
  if(e.kind==='accept')return ['accept',`Accept, ${viaWords(e.via)}`];
  if(e.undoneBy)return ['undone','Undone'];
  if(e.issuedBy)return ['issued','Issued'];
  return ['landed','Landed']}

/* ───────────── the drawing, and its snaps ───────────── */
const cache=new Map();
function sheetAt(sheet,limit){
  const key=`${sheet}|${limit??'live'}|${jver}`;if(cache.has(key))return cache.get(key);
  const base=DP.data[sheet];
  let items=base.items.map(([o,c,w,r])=>({o,c,w,r}));const objects=base.objects.slice();
  // the real snap points: [snap, x, y, object, which, with]
  let snaps=base.snaps.map(([k,x,y,o,which,w])=>({k,x,y,o,which,w}));
  const index=id=>objects.findIndex(o=>o.id===`${sheet}/${id}`);
  for(const e of J){
    if(limit!=null&&e.n>limit)break;
    if(e.kind!=='change_set'||!e.landed.includes(sheet))continue;
    if(e.undoneBy&&(limit==null||e.undoneBy<=limit))continue;
    for(const op of e.ops){if(op.sheet!==sheet)continue;
      if(op.op==='move'){const i=index(op.target),[dx,dy]=op.by;
        items=items.map(it=>it.o!==i?it:{...it,r:it.r.map(run=>run.map(([x,y])=>[x+dx,y+dy]))});
        // a faked move: its own snaps go with it; its crossings are dropped (the core would work them out again)
        snaps=snaps.filter(s=>!(s.k==='intersection'&&(s.o===i||s.w===i))).map(s=>s.o!==i?s:{...s,x:s.x+dx,y:s.y+dy})}
      if(op.op==='add_line'){objects.push({id:`${sheet}/${op.id}`,type:'line',layer:op.layer});const o=objects.length-1;
        items.push({o,c:7,w:.35,r:[[op.from,op.to]]});
        snaps.push({k:'endpoint',x:op.from[0],y:op.from[1],o,which:'from'},{k:'endpoint',x:op.to[0],y:op.to[1],o,which:'to'},{k:'midpoint',x:(op.from[0]+op.to[0])/2,y:(op.from[1]+op.to[1])/2,o,which:''})}}}
  for(const it of items){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const run of it.r)for(const [x,y] of run){if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y}it.bb=[a,b,c,d]}
  // circles, for Tangent: a centre whose four quadrants are as far from it (an ellipse's are not)
  const circles=[];
  for(const c of snaps)if(c.k==='center'){const pre=c.which?c.which+'.':'';
    const q=['0','90','180','270'].map(a=>snaps.find(s=>s.k==='quadrant'&&s.o===c.o&&s.which===pre+a)).filter(Boolean);
    if(q.length===4){const rs=q.map(s=>Math.hypot(s.x-c.x,s.y-c.y));if(Math.max(...rs)-Math.min(...rs)<1e-6)circles.push({x:c.x,y:c.y,r:rs[0],o:c.o,which:c.which})}}
  const v={sheet,paper:base.paper,units:base.units,items,objects,snaps,circles};cache.set(key,v);return v}
function objBox(sh,idx){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const it of sh.items)if(it.o===idx){a=Math.min(a,it.bb[0]);b=Math.min(b,it.bb[1]);c=Math.max(c,it.bb[2]);d=Math.max(d,it.bb[3])}return a>c?null:[a,b,c,d]}
const ACI={1:'#ff4a4a',2:'#ffff3a',3:'#3aff3a',4:'#3affff',5:'#4f7cff',6:'#ff4aff',7:'#eef1f4',8:'#8a8f96',9:'#c0c0c0'};

const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
let cw=0,ch=0,dpr=1,touched=false,fitK=1,raf=0;
const V={k:60,x:0,y:11};
const sx=x=>(x-V.x)*V.k,sy=y=>(V.y-y)*V.k,wx=X=>X/V.k+V.x,wy=Y=>V.y-Y/V.k;
function covered(){const c=$('cmdbar').getBoundingClientRect().height+18;return phone()?S_peek()+c+6:c}
function S_peek(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--peek'))||0}
function fitTo(box,maxK,bottom){
  const [t,r,b,l]=[10,phone()?10:56,bottom??covered(),10];
  const W=box[2]-box[0],H=box[3]-box[1],aw=Math.max(40,cw-l-r),ah=Math.max(40,ch-t-b);
  let k=Math.min(aw/W,ah/H);if(maxK)k=Math.min(k,maxK);V.k=k;
  V.x=(box[0]+box[2])/2-(l+aw/2)/k;V.y=(box[1]+box[3])/2+(t+ah/2)/k}
function fit(){const p=current().paper;fitTo([0,0,p.width,p.height]);fitK=V.k}
function current(){return sheetAt(S.sheet,S.at)}
function resize(){
  const r=stage.getBoundingClientRect(),mid=[wx(cw/2),wy(ch/2)];cw=r.width;ch=r.height;dpr=window.devicePixelRatio||1;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  if(!touched)fit();else{V.x=mid[0]-cw/2/V.k;V.y=mid[1]+ch/2/V.k}
  draw()}
function zoomAt(c,f){
  const k=Math.max(fitK*.5,Math.min(fitK*32,V.k*f)),X=wx(c[0]),Y=wy(c[1]);V.k=k;V.x=X-c[0]/k;V.y=Y+c[1]/k;keepInSight()}
function keepInSight(){const p=current().paper,m=60;
  V.x=Math.min(Math.max(V.x,-(cw-m)/V.k),p.width-m/V.k);
  V.y=Math.min(Math.max(V.y,m/V.k),p.height+(ch-m)/V.k)}

/* ── finding the snap nearest the cursor, within reach (the app does this in the renderer, with no round trip) ── */
const REACH_MOUSE=12,REACH_TOUCH=22; // CSS pixels: AutoCAD's aperture is 10; a finger needs more
function segs(sh){ // every straight piece the sheet draws, and the lines the preview drew
  const out=[];for(const it of sh.items)for(const run of it.r)for(let i=1;i<run.length;i++)out.push([run[i-1],run[i],it.o,it.bb]);
  for(const [a,b] of drawnSegs())out.push([a,b,-1,[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[0],b[0]),Math.max(a[1],b[1])]]);
  return out}
function drawnSegs(){const d=S.drawn[S.sheet]||[];const out=d.slice();const p=S.line.pts;for(let i=1;i<p.length;i++)out.push([[p[i-1].x,p[i-1].y],[p[i].x,p[i].y]]);return out}
function foot(px,py,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],l=vx*vx+vy*vy;const t=l?((px-a[0])*vx+(py-a[1])*vy)/l:0;return [a[0]+t*vx,a[1]+t*vy,t]}
function findSnaps(X,Y,reach){
  if(!S.osnap||S.at!==null)return [];
  const sh=current(),x=wx(X),y=wy(Y),r=reach/V.k,c=[],on=S.kinds;
  const add=(s)=>{const d=Math.hypot(s.x-x,s.y-y);if(d<=r)c.push({...s,d})};
  for(const s of sh.snaps)if(on.has(s.k)&&Math.abs(s.x-x)<=r&&Math.abs(s.y-y)<=r)add(s);
  // the lines drawn in the preview snap too (worked out in this page)
  for(const [a,b] of drawnSegs()){if(on.has('endpoint')){add({k:'endpoint',x:a[0],y:a[1],o:-1});add({k:'endpoint',x:b[0],y:b[1],o:-1})}
    if(on.has('midpoint'))add({k:'midpoint',x:(a[0]+b[0])/2,y:(a[1]+b[1])/2,o:-1})}
  const from=S.mode==='line'&&S.line.pts.length?S.line.pts.at(-1):null;
  // Perpendicular and Tangent mean something only from a point: inside a tool (worked out in this page)
  if(from&&on.has('perpendicular'))for(const [a,b,o,bb] of segs(sh)){
    if(x<bb[0]-r*4||x>bb[2]+r*4||y<bb[1]-r*4||y>bb[3]+r*4)continue;
    const [fx,fy,t]=foot(from.x,from.y,a,b);if(t<-1e-9||t>1+1e-9)continue;if(Math.hypot(fx-from.x,fy-from.y)<1e-6)continue;
    if(Math.hypot(b[0]-a[0],b[1]-a[1])<.05)continue; // a curve's short chords: AutoCAD's would be on the curve; left out here
    add({k:'perpendicular',x:fx,y:fy,o})}
  if(from&&on.has('tangent'))for(const ci of sh.circles){const dx=from.x-ci.x,dy=from.y-ci.y,d=Math.hypot(dx,dy);if(d<=ci.r)continue;
    const a=Math.atan2(dy,dx),b=Math.acos(ci.r/d);for(const s of [1,-1])add({k:'tangent',x:ci.x+ci.r*Math.cos(a+s*b),y:ci.y+ci.r*Math.sin(a+s*b),o:ci.o})}
  // Nearest is taken only when nothing else is in reach, as it is everywhere on every object
  if(on.has('nearest')&&!c.length){let best=null;for(const [a,b,o,bb] of segs(sh)){if(x<bb[0]-r||x>bb[2]+r||y<bb[1]-r||y>bb[3]+r)continue;
      let [fx,fy,t]=foot(x,y,a,b);if(t<0){fx=a[0];fy=a[1]}else if(t>1){fx=b[0];fy=b[1]}const d=Math.hypot(fx-x,fy-y);if(d<=r&&(!best||d<best.d))best={k:'nearest',x:fx,y:fy,o,d}}
    if(best)c.push(best)}
  const tie=2/V.k;
  c.sort((p,q)=>Math.abs(p.d-q.d)>tie?p.d-q.d:PRIO.indexOf(p.k)-PRIO.indexOf(q.k));
  // one candidate per place: the same point found twice (an end that is also a crossing) is offered once
  const out=[];for(const s of c)if(!out.some(o=>Math.hypot(o.x-s.x,o.y-s.y)<1e-6&&o.k===s.k))out.push(s);
  return out}
function hoverAt(X,Y,reach){S.cands=findSnaps(X,Y,reach);S.candI=0;S.hover=S.cands[0]||null}
const objName=o=>o<0?'your line':(()=>{const ob=current().objects[o];if(!ob)return '?';const tail=ob.id.split('/').slice(1).join('/');return ob.name??(/^objects\[/.test(tail)?ob.block??ob.type:tail)})();
function snapWords(s){if(!s)return '';const n=SN[s.k].label;
  return s.k==='intersection'&&s.w!=null?`${n} of ${objName(s.o)} and ${objName(s.w)}`:`${n} of ${objName(s.o)}`}
// the snapped point an operation would take (docs/change-sets.md, Snapped points)
function snappedPoint(s){const o=current().objects[s.o];if(!o||!['endpoint','midpoint','center','quadrant','insertion','node','intersection'].includes(s.k))return null;
  const p={id:o.id,snap:s.k};if(s.which)p.which=s.which;if(s.k==='intersection'&&s.w!=null)p.with={id:current().objects[s.w].id};return {snap:p}}

/* ── drawing ── */
function marks(){
  const e=entry(S.focused);if(!e)return [];
  const sh=current();
  return changedOn(e,S.sheet).map(m=>({idx:sh.objects.findIndex(o=>up(o.id)===up(m.id)),added:m.how==='added'})).filter(m=>m.idx>=0)}
function selIndex(){if(!S.sel)return -1;const sh=current();return sh.objects.findIndex(o=>o.id===S.sel)}
function strokeItem(it){ctx.beginPath();for(const run of it.r){run.forEach(([x,y],i)=>i?ctx.lineTo(sx(x),sy(y)):ctx.moveTo(sx(x),sy(y)))}ctx.stroke()}
function scene(){ // the drawing itself, in the view V: the main view, or the magnifier's
  const past=S.at!==null,sh=current(),p=sh.paper,k=V.k,W=cw,H=ch;
  if(S.grid){for(const [step,col] of [[.25,past?'#302b23':'#272f39'],[1,past?'#3b342a':'#313a46']]){if(step*k<7)continue;ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();

  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}

/* wiring */
$('undo').onclick=()=>undo(lastUndoable());$('accept').onclick=askAccept;
$('toolsbtn').onclick=()=>{const o=document.body.classList.toggle('tools-open');$('toolsbtn').setAttribute('aria-expanded',o)};
document.querySelectorAll('#status [data-tog]').forEach(b=>b.onclick=()=>toggle(b.dataset.tog));
document.querySelectorAll('.stab').forEach(b=>b.onclick=()=>{S.side=b.dataset.side;if(phone()&&S.snap==='peek')setSnap('half');updateUI()});
document.querySelectorAll('#proto .mode').forEach(b=>b.onclick=()=>{if(S.mode!==b.dataset.mode)setMode(b.dataset.mode)});
$('reset').onclick=()=>{const m=S.mode;seed();S.mode=m;cache.clear();touched=false;$('toast').hidden=true;$('modal').hidden=true;closeMenu();fit();setSnap('peek');refresh()};
stage.addEventListener('pointerdown',()=>{if(document.body.classList.contains('tools-open'))closeTools()},true);
addEventListener('keydown',e=>{
  if(e.key==='F3'||e.key==='F7'||e.key==='F8'){e.preventDefault();toggle(e.key==='F3'?'osnap':e.key==='F7'?'grid':'ortho');return}
  if(e.key==='Tab'&&S.cursor&&S.cands.length>1){e.preventDefault();S.candI=(S.candI+1)%S.cands.length;S.hover=S.cands[S.candI];showCoords();draw();return}
  if(e.key==='Enter'&&S.mode==='line'&&!e.target.closest('button')){e.preventDefault();lineDone();return}
  if(e.key==='Escape'){if(S.menu){closeMenu();return}if(!$('modal').hidden){$('modal').hidden=true;return}
    if(S.mode==='line'){if(S.line.pts.length){S.line={pts:[]};log('LINE: cancelled');refresh()}else setMode('snaps');return}
    if(S.prompt){S.prompt=null;updateUI();return}if(S.sel){pick(-1);return}if(S.at!==null)backToLive()}});
new ResizeObserver(resize).observe(stage);
seed();
{const q=new URLSearchParams(location.search).get('sheet');if(q&&DP.sheets.includes(q))S.sheet=q}
buildRibbon();resize();refresh();
window.__proto={get S(){return S},V,draw,sx,sy,wx,wy,current,objBox,findSnaps,setMode,showEntry,backToLive};
