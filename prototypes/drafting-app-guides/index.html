<!doctype html>
<!--
  PROTOTYPE, throwaway. Issue #157, build 9 of the drafting app: guides. The assistant gives a guide, a list of steps
  as data (what to say, which drawing tool, where to click as snapped points, the operation that completes the step),
  and the page runs it on the drafter's own drawing: the step's words, the tool's button pulsing, a ring at the point,
  and each step checked against what the drafter does. It starts from the Array prototype
  (prototype/drafting-app-array-66) with its Array tool taken out, as the app ships today, and keeps builds 4 to 8
  and Copy as built. The open choices are in the Options pill, each option live, the recommended one first and where
  the page starts (?words=banner|panel|callout&off=note|undo|accept&lands=real|practice&drive=show|forme|both;
  &guide=offer puts the assistant's guide in the chat, &guide=start starts it). No core runs: the page fakes change,
  the journal, display-list and the guide command on the demo plant's display lists (demo-plant.js) and its texts
  and attributes (props.js), all made up and public. Nothing here is production code.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>AgentDrafter, guides (prototype)</title>
<style>
:root{--frame:#1e2530;--ribbon:#394150;--strip:#303845;--edge:#4b5464;--canvas:#212830;--text:#e6e9ee;--dim:#a3adba;--blue:#4aa3ff;
  --ok:#3ddc84;--warn:#ffb020;--bad:#ff5d5d;--past:#e0a85a;--snap:#f2e24b;
  --ui:"Segoe UI",system-ui,-apple-system,sans-serif;--mono:Consolas,"Cascadia Mono",ui-monospace,Menlo,monospace;--peek:0px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font:13px/1.35 var(--ui);color:var(--text);background:var(--frame);display:grid;grid-template:minmax(0,1fr) / minmax(0,1fr);height:100dvh;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
svg{display:block}

/* the prototype's Options pill and panel: the questions still open, for Zach, outside the product */
#optpill{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:60;background:#000;color:#ffd84a;border:1px solid #ffd84a;border-radius:14px;padding:3px 12px;font:600 12px var(--ui);box-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap}
#optpill[aria-expanded=true]{background:#ffd84a;color:#000}
#optpanel{position:fixed;top:36px;left:50%;transform:translateX(-50%);z-index:60;width:min(760px,calc(100vw - 16px));max-height:calc(100dvh - 46px);overflow:auto;overscroll-behavior:contain;background:#0b0b0b;color:#f3f0e0;border:2px solid #ffd84a;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.7);padding:10px 12px 12px;font-size:12.5px;-webkit-user-select:text;user-select:text}
#optpanel .ohead{display:flex;align-items:center;gap:8px;margin:0 0 4px}
#optpanel .ohead b{color:#ffd84a;font-size:13px;flex:1}
#optpanel .ox{background:none;border:0;color:#ffd84a;font-size:20px;line-height:1;padding:0 4px}
#optpanel .onote{color:#ffd84a;font-weight:600;margin:0 0 6px}
.oq{border-top:1px solid #3a3420;padding:8px 0 7px}
.oq h4{margin:0 0 5px;font-size:12.5px;color:#fff;font-weight:600}
.oseg{display:flex;flex-wrap:wrap;gap:4px}
.oseg button,.ostate button,.obtns button{background:#000;border:1px solid #806c25;color:#ffd84a;border-radius:4px;padding:3px 9px;font-size:12px;text-align:left}
.oseg button[aria-pressed=true]{background:#ffd84a;color:#000;border-color:#ffd84a;font-weight:600}
.oline{margin:5px 0 0;color:#e8e0bc;line-height:1.4}
.ostate{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px;padding:4px 6px;border:1px dashed #806c25;border-radius:4px}
.ostate>span{color:#bfb48a;margin-right:2px}
.ostate button{border-style:dashed;padding:2px 8px}
.ostate button[aria-pressed=true]{background:#3a3214;color:#fff;border-color:#ffd84a;border-style:solid}
.obtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid #3a3420;padding-top:8px}
.obtns>span{color:#bfb48a}
#optpanel details{border-top:1px solid #3a3420;padding-top:6px;margin-top:8px}
#optpanel summary{cursor:pointer;color:#ffd84a}
#optpanel details ul{margin:6px 0 0;padding-left:18px;line-height:1.45;color:#e8e0bc}
#optpanel details li{margin:3px 0}
#optpanel code{font:11.5px var(--mono);background:#26220f;padding:0 4px;border-radius:2px;color:#fff}
#app{display:grid;grid-template:auto auto auto minmax(0,1fr) auto / minmax(0,1fr);min-height:0;min-width:0;position:relative}
#title{grid-row:1}#ribbon{grid-row:2}#tabs{grid-row:3}#work{grid-row:4}#status{grid-row:5}

/* title bar */
#title{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;background:var(--frame);border-bottom:1px solid #121821;min-width:0}
#title .mark{width:20px;height:20px;flex:none}
#title .name{font-weight:600}
#title .file{flex:1;text-align:left;padding-left:6px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qa{background:none;border:1px solid transparent;border-radius:3px;padding:3px 7px;display:flex;align-items:center;gap:5px;color:var(--text);white-space:nowrap}
.qa:hover:not(:disabled){background:#333c49;border-color:var(--edge)}
.qa:disabled{opacity:.42}
#toolsbtn{display:none}
.pills{display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden}
.pill{border:1px solid #4f5a6a;background:#2a323e;border-radius:11px;padding:1px 9px;white-space:nowrap;color:var(--dim);font-size:12px}
.pill.past{border-color:var(--past);background:#4a3a22;color:#ffe2b8;font-weight:600}
.btn{background:#3a4250;border:1px solid #5a6577;border-radius:3px;padding:4px 12px;white-space:nowrap}
.btn:hover:not(:disabled){background:#4a5567}
.btn:disabled{opacity:.42}
.btn.primary{background:#1f6fc9;border-color:#3d8fe8;font-weight:600}
.btn.primary:hover:not(:disabled){background:#2a7fdc}
.btn.primary.blocked{background:#2b4566;border-color:#3f5f86;color:#c8d6e8}
.btn.sm{padding:2px 9px;font-size:12px}
.btn.danger{border-color:#8a3434;color:#ffc4c4}
.btn.warn{background:#7a5410;border-color:#c98a1c;color:#fff;font-weight:600}
.btn.warn:hover{background:#8d6216}

/* ribbon */
#ribbon{display:flex;background:var(--ribbon);border-bottom:1px solid #151b24;padding:0 4px;overflow-x:auto;scrollbar-width:none}
.panel{display:flex;flex-direction:column;border-right:1px solid var(--edge);flex:none}
.panel .row{display:flex;gap:2px;flex:1;align-items:center;padding:5px 6px 3px}
.panel h3{margin:0;padding:2px 8px 3px;text-align:center;font-size:11px;font-weight:400;color:var(--dim);background:var(--strip);display:flex;justify-content:center;align-items:center;gap:6px}
.rb{display:grid;justify-items:center;gap:3px;min-width:60px;padding:6px 6px 4px;border:1px solid transparent;border-radius:3px;background:none;font-size:12px;color:#dfe5ec;position:relative}
.rb svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rb .pt{fill:var(--blue);stroke:none}
.rb:hover{background:#414a5a;border-color:#56627a}
.rb.on{background:#274b76;border-color:var(--blue);color:#fff}
.layerbox{display:grid;gap:5px;min-width:210px}
.layerbox .lay{display:flex;align-items:center;gap:6px;background:#2b323d;border:1px solid var(--edge);border-radius:3px;padding:0 0 0 8px;position:relative}
.layerbox .sw{width:13px;height:13px;border:1px solid #111;flex:none}
.layerbox select{flex:1;min-width:0;background:transparent;border:0;padding:4px 6px 4px 0;color:var(--text);appearance:auto}
.layerbox select:disabled{opacity:1;color:var(--text)}
.layerbox select option{background:#2b323d}
.layerbox small{color:var(--dim);font-size:11px}
.panel.foldonly{display:none}
.tog2{background:#2b323d;border:1px solid var(--edge);border-radius:3px;padding:6px 10px;color:#7f8a98}
.tog2[aria-pressed=true]{color:#7fc0ff;border-color:#3d6c9e}

/* a tab for each sheet */
#tabs{display:flex;align-items:flex-end;gap:1px;background:#2a313c;padding:3px 6px 0;border-bottom:1px solid #151b24;overflow-x:auto;scrollbar-width:none}
.tab{background:#333b47;border:1px solid #454e5c;border-bottom:0;border-radius:3px 3px 0 0;padding:4px 12px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:#fff}
.tab.on{background:var(--canvas);color:#fff;border-color:#5a6577}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.info{background:var(--blue)}.dot.bad{background:var(--bad)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}

/* the work area */
#work{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0;position:relative}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--canvas)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;cursor:none}
#cv.grabbing{cursor:grabbing}
#zoom{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:grid;gap:1px;z-index:3;background:#3a4250;border:1px solid #5a6577;border-radius:4px;overflow:hidden}
#zoom button{width:34px;height:32px;background:none;border:0;font-size:17px;line-height:1}
#zoom button:hover{background:#4a5567}
#zoom .fit{font-size:11px}
#toast{position:absolute;left:12px;top:12px;z-index:6;display:flex;gap:10px;align-items:flex-start;max-width:min(520px,calc(100% - 70px));padding:8px 10px 8px 12px;border-radius:4px;background:rgba(48,56,69,.97);border:1px solid #5a6577;border-left:3px solid var(--blue);box-shadow:0 6px 18px rgba(0,0,0,.4);animation:tin .2s ease-out}
#toast.ok{border-left-color:var(--ok)}#toast.bad{border-left-color:var(--bad)}#toast.warn{border-left-color:var(--warn)}
#toast b{display:block}#toast small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
#toast .tx{flex:1;min-width:0}
#toast .acts{display:flex;flex-direction:column;gap:4px}
pre.cs{margin:6px 0 0;padding:6px 8px;background:#1b2129;border:1px solid #3c4553;border-radius:3px;font:11px/1.4 var(--mono);color:#cfe3ff;white-space:pre-wrap;overflow-wrap:anywhere;max-height:190px;overflow:auto}
pre.cs .k{color:#9fe6bd}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#note{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:5;max-width:min(440px,calc(100% - 32px));padding:12px 14px;border-radius:5px;background:#3a2a24;border:1px solid #8a5a3a;color:#ffd9c2}

/* the Text tool's box (one of the Text choices) */
#tbox{position:absolute;z-index:7;width:290px;background:rgba(48,56,69,.98);border:1px solid #6a7689;border-radius:5px;box-shadow:0 8px 22px rgba(0,0,0,.5);padding:8px 10px}
#tbox label{display:grid;gap:3px;font-size:11px;color:var(--dim);margin-bottom:6px}
#tbox input{background:#1b2129;border:1px solid #5a6577;border-radius:3px;padding:5px 7px;color:#fff;font-size:14px;width:100%}
#tbox .two{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:end}
#tbox .acts{display:flex;gap:6px;justify-content:flex-end}
#arr{position:absolute;z-index:7;width:330px;font:13px var(--ui);background:rgba(48,56,69,.98);border:1px solid #6a7689;border-radius:5px;box-shadow:0 8px 22px rgba(0,0,0,.5);padding:8px 10px}
#arr .ah{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}#arr .ah span{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#arr .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
#arr label{display:grid;gap:2px;font-size:11px;color:var(--dim)}#arr label small{font-size:10.5px;color:#8f99a6}
#arr input{background:#1b2129;border:1px solid #5a6577;border-radius:3px;padding:5px 7px;color:#fff;font-size:14px;width:100%}
#arr .foot{display:flex;gap:6px;align-items:center;margin-top:8px}#arr .foot span{flex:1;font-size:12px;color:#cfe6ff}#arr .foot span.bad{color:#ffb0b0}
#arr .ah{justify-content:space-between;align-items:center}
#arr .akinds,#arr .aseg{display:flex;border:1px solid #5a6577;border-radius:4px;overflow:hidden;flex:none}
#arr .akinds button,#arr .aseg button{background:#2b323d;border:0;padding:4px 10px;color:var(--dim);font:12px var(--ui)}
#arr .akinds button+button,#arr .aseg button+button{border-left:1px solid #5a6577}
#arr .akinds button[aria-pressed=true],#arr .aseg button[aria-pressed=true]{background:#1f6fc9;color:#fff}
#arr .ahold{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:11px;color:var(--dim)}
#arr .apick{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;min-height:26px}
#arr .apick .al{color:var(--dim);width:42px;flex:none}
#arr .apick .av{flex:1;color:#e6e9ee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#arr .apick .av.live{color:#f2e24b}
#arr label.achk{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:#dfe5ec}
#arr label.achk input{width:auto;margin:0}
#hedit{position:absolute;z-index:8}
#hedit input{width:104px;background:#1b2129;border:1px solid #4aa3ff;border-radius:11px;padding:2px 10px;color:#fff;font:13px var(--mono);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.dflt{color:#9fd0ff}

/* quick properties */
#qp{position:absolute;z-index:4;width:268px;max-height:calc(100% - 90px);display:flex;flex-direction:column;background:rgba(48,56,69,.97);border:1px solid #5a6577;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#qp header{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;background:var(--strip);border-bottom:1px solid var(--edge);border-radius:4px 4px 0 0}
#qp header b{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qp header button{background:none;border:0;color:var(--dim);font-size:15px;line-height:1;padding:2px 6px}
#qp header button:hover{color:#fff}
#qp .body{padding:6px 10px 8px;overflow:auto}
#qp .acts{display:flex;gap:6px;padding:6px 10px 8px;border-top:1px solid var(--edge)}
.prow{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;padding:2px 0}
.prow span{color:var(--dim)}
.prow output{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.prow output.tmpl{color:#ffd28a;font-family:var(--ui)}
#qp h5{margin:8px 0 3px;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
#qp{width:300px;z-index:5}
body.ined-open #qp{visibility:hidden}
#qp header .qptype{color:var(--dim);font-size:11px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
#qp .acts{align-items:center}
#qp .acts .grow{flex:1}
#qp .acts .pend{font-size:11px;color:#ffd28a}
.prow.ed{grid-template-columns:78px minmax(0,1fr);align-items:center;padding:2px 0}
.prow.ed label{color:var(--dim);display:flex;flex-direction:column;gap:1px;line-height:1.15;overflow-wrap:anywhere}
.prow.ed input,.prow.ed select,.prow.ed textarea{width:100%;min-width:0;background:#1b2129;border:1px solid #4b5464;border-radius:3px;padding:3px 6px;color:#fff;font:12px var(--mono)}
.prow.ed select{font-family:var(--ui);padding:2px 4px}
.prow.ed textarea{resize:vertical;font-size:11px;line-height:1.35}
.prow.ed input:hover:not(:disabled),.prow.ed select:hover:not(:disabled),.prow.ed textarea:hover:not(:disabled){border-color:#6a7689}
.prow.ed input:focus,.prow.ed select:focus,.prow.ed textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(74,163,255,.25)}
.prow.ed :disabled{opacity:.6;background:transparent;border-color:transparent}
.prow.ed.dirty input,.prow.ed.dirty select,.prow.ed.dirty textarea{border-color:#c98a1c;background:#2e2717}
.prow.ed.dirty label::after{content:"edited";font-size:10px;color:#ffd28a}
.fb{display:inline-block;width:max-content;font:10px var(--ui);padding:0 5px;border-radius:7px;margin-top:1px}
.fb.t{background:#4a3a1a;color:#ffd28a;border:1px solid #7a5a22}
.fb.r{background:#1d3550;color:#a9cdf5;border:1px solid #2f557e}
.fnote{grid-column:1/-1;font:11px/1.35 var(--ui);padding:4px 7px;border-radius:3px;margin:2px 0 3px}
.fnote.t{background:rgba(74,54,18,.9);border:1px solid #8a6218;color:#ffe2b0}
.fnote.r{background:#20303f;border:1px solid #2f4b66;color:#c8def5}
.fnote.e{background:#3a2020;border:1px solid #8a3434;color:#ffc4c4}
#ined{position:absolute;z-index:8;background:rgba(27,33,41,.98);border:1px solid var(--blue);border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.5);padding:6px}
#ined input,#ined textarea{display:block;width:100%;background:#212830;border:1px dashed #6a7689;border-radius:2px;color:#eef1f4;font-family:"Segoe UI",Arial,sans-serif;font-weight:300;padding:2px 5px;outline:none;resize:vertical}
#ined .fnote{margin:5px 0 0}
#ined .inhelp{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:4px;font:11px var(--ui);color:var(--dim)}
.dialog.eatt{width:min(560px,100%)}
.dialog h3 small{font-weight:400;color:var(--dim);font-size:12px}
.eatt-list{border:1px solid #4b5464;border-radius:3px;max-height:260px;overflow:auto;background:#252c36}
.eatt-list .eh,.eatt-list .er{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1.2fr);gap:8px;padding:4px 8px;text-align:left;width:100%}
.eatt-list .eh{position:sticky;top:0;background:#353e4b;color:var(--dim);font-size:11px}
.eatt-list .er{background:none;border:0;border-top:1px solid #313a46;font-size:12px}
.eatt-list .er span:first-child{font-family:var(--mono);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.eatt-list .er span:last-child{font-family:var(--mono);overflow-wrap:anywhere}
.eatt-list .er.on{background:#274b76}
.eatt-list .er.dirty span:last-child{color:#ffd28a}
.eav{display:grid;gap:3px;margin-top:10px;font-size:12px;color:var(--dim)}
.eav input{background:#1b2129;border:1px solid #5a6577;border-radius:3px;padding:6px 8px;color:#fff;font:14px var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#2a313c;border:1px solid #5a6577;border-radius:10px;padding:1px 8px;font-size:12px;text-align:left}
.chip:hover{border-color:var(--blue)}
.muted{color:var(--dim)}

/* the command bar */
#cmd{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(820px,calc(100% - 24px));z-index:4;font:13px var(--mono)}
#hist{padding:0 12px 4px;color:#aeb8c4;text-shadow:0 1px 3px #000,0 0 6px #212830;pointer-events:none}
#hist div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdwarn{display:flex;align-items:flex-start;gap:8px;margin:0 0 4px;padding:6px 10px;background:rgba(74,54,18,.97);border:1px solid #c98a1c;border-radius:4px;color:#ffe2b0;font:13px var(--ui);box-shadow:0 4px 14px rgba(0,0,0,.45)}
#cmdwarn b{color:#fff}
#cmdwarn .x{margin-left:auto;background:none;border:0;color:#ffe2b0;font-size:15px;line-height:1;padding:0 4px}
#cmdbar{display:flex;align-items:center;gap:4px 8px;background:rgba(58,66,80,.97);border:1px solid #6a7689;border-radius:4px;padding:5px 10px;box-shadow:0 4px 14px rgba(0,0,0,.45);min-height:34px}
#cmdbar .chev{color:var(--dim);flex:none}
#cmdline{flex:1 1 auto;min-width:0;white-space:normal;line-height:1.5}
#cmdname{font-weight:700;color:#fff;margin-right:6px}
.laytag{color:#9fd0ff;margin-right:6px}
.snapw{color:var(--snap);font-weight:600}
.opt{background:none;border:0;color:#7fc0ff;padding:0 1px;text-decoration:underline;font:inherit}
.opt:hover{color:#fff}
#cmdin{flex:0 0 150px;min-width:0;background:transparent;border:0;border-bottom:1px solid #6a7689;color:#fff;font:13px var(--mono);padding:2px 2px;outline:none}
#cmdin:focus{border-bottom-color:var(--blue)}
#kbd{display:none}
#cmdnote{color:#7f8a98;font:11px var(--ui);white-space:nowrap;flex:none}

/* status bar */
#status{display:flex;align-items:stretch;gap:2px;height:28px;padding:0 6px;background:var(--frame);border-top:1px solid #121821;font-size:12px;color:var(--dim);min-width:0}
#coords{font-family:var(--mono);align-self:center;min-width:250px;padding-left:10px;color:var(--text);white-space:nowrap}
#coords .snapw{font-family:var(--ui);font-weight:400;margin-left:8px}
#paperlabel{align-self:center;padding:0 10px;white-space:nowrap}
.tog{background:none;border:0;padding:0 9px;color:#7f8a98;white-space:nowrap}
.tog[aria-pressed=true]{color:#7fc0ff}
.tog:hover{background:#2c3440}
.tog kbd{font:10px var(--mono);opacity:.7;margin-left:3px}
.osgroup{display:flex;align-items:stretch}
.osgroup .tog[data-tog=osnap]{padding-right:4px}
#osmenubtn{background:none;border:0;padding:0 7px;color:#7f8a98;font-size:10px}
#osmenubtn:hover,#osmenubtn[aria-expanded=true]{background:#2c3440;color:#fff}
.grow{flex:1}
.live{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:0 8px}
.live i{width:8px;height:8px;border-radius:50%;background:#6b7584;flex:none}
.live.open i{background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,132,.18)}
.live.past i{background:var(--past)}

/* the object snap menu */
#osmenu{position:fixed;z-index:35;width:330px;background:#2f3743;border:1px solid #5a6577;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.6);padding:8px 0 6px;font-size:13px}
#osmenu header{display:flex;align-items:center;gap:8px;padding:0 12px 6px;border-bottom:1px solid #3c4553}
#osmenu header b{flex:1}
#osmenu .sw2{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--edge);border-radius:12px;padding:1px 9px 1px 4px;font-size:12px;color:var(--dim)}
#osmenu .sw2 i{width:22px;height:12px;border-radius:6px;background:#4b5464;position:relative}
#osmenu .sw2 i::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:#c8d0da;transition:left .15s}
#osmenu .sw2[aria-checked=true]{color:#7fc0ff;border-color:#3d6c9e}
#osmenu .sw2[aria-checked=true] i{background:#1f6fc9}
#osmenu .sw2[aria-checked=true] i::after{left:12px;background:#fff}
#osmenu ul{list-style:none;margin:0;padding:4px 0}
#osmenu li.grp{padding:8px 12px 2px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.osrow{display:grid;grid-template-columns:18px 22px minmax(0,1fr);gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:4px 12px}
.osrow:hover{background:#3a4352}
.osrow .ck{width:15px;height:15px;border:1px solid #6a7689;border-radius:3px;display:grid;place-items:center;font-size:11px;line-height:1;color:#fff}
.osrow[aria-checked=true] .ck{background:#1f6fc9;border-color:#3d8fe8}
.osrow svg{width:22px;height:22px;fill:none;stroke:var(--snap);stroke-width:1.6}
.osrow small{display:block;color:var(--dim);font-size:11px;line-height:1.25}
#osmenu.off .osrow svg{stroke:#7f8a98}
#osmenu footer{display:flex;gap:6px;padding:6px 12px 0;border-top:1px solid #3c4553;align-items:center}
#osmenu footer small{flex:1;color:var(--dim);font-size:11px}

/* the side panel */
#side{display:flex;flex-direction:column;min-height:0;background:#2a313c;border-left:1px solid #121821}
#grab{display:none}
#peek{display:none}
#sidetabs{display:flex;align-items:center;gap:4px;padding:6px 10px 0;border-bottom:1px solid #3c4553}
.stab{background:none;border:0;border-bottom:2px solid transparent;padding:4px 8px 6px;color:var(--dim);display:flex;gap:6px;align-items:center}
.stab.on{color:#fff;border-color:var(--blue)}
.soon{font-size:10px;line-height:1;padding:2px 5px;border-radius:7px;background:#4b5464;color:#dfe5ec;letter-spacing:.02em}
#sidebody{flex:1;min-height:0;overflow:auto;padding:8px 10px 14px}
.jhead{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.jhead b{font-size:14px}
.stepper{margin-left:auto;display:flex;align-items:center;gap:2px;font-family:var(--mono);font-size:12px}
.stepper button{background:#3a4250;border:1px solid #5a6577;border-radius:3px;width:28px;height:26px;font-size:16px;line-height:1}
.stepper span{min-width:46px;text-align:center}
.jlist{list-style:none;margin:0;padding:0}
.je{border:1px solid transparent;border-radius:4px;margin-bottom:2px}
.je.on{border-color:#4f5a6a;background:#303845}
.je.at{border-color:var(--past);background:#3a3326}
.je-head{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:start;width:100%;text-align:left;background:none;border:0;padding:6px 6px}
.je-n{font-family:var(--mono);color:var(--dim)}
.je-t{display:block}
.je-m{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;margin-top:2px}
.sh-landed{color:#9fe6bd}
.badge{font-size:11px;padding:1px 7px;border-radius:9px;white-space:nowrap;border:1px solid #4f5a6a;color:var(--dim)}
.b-landed{border-color:#2c6a46;color:#9fe6bd}.b-issued{border-color:#3d6c9e;color:#a9cdf5}
.b-undone{color:#8f99a6;text-decoration:line-through}.b-undo,.b-accept{color:#c8d0da}
.je-det{padding:0 8px 8px 36px;font-size:12px}
.je-det p{margin:4px 0}
.revsep{color:#7f8a98;font-size:11px;text-align:center;padding:8px 0;border-top:1px dashed #3c4553;margin-top:6px}
.assist{padding:14px 6px;color:var(--dim);line-height:1.5}
.assist h4{color:var(--text);margin:0 0 6px;font-size:14px}
.assist .ghost{margin-top:14px;border:1px dashed #4f5a6a;border-radius:6px;padding:10px;color:#7f8a98}

#tip{position:fixed;z-index:30;width:270px;padding:8px 10px;background:#f4f6f8;color:#1c232d;border-radius:3px;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;line-height:1.4}
#tip b{display:block;margin-bottom:2px}
#tip kbd{font:12px var(--mono);background:#dfe4ea;border-radius:2px;padding:0 4px;margin-left:4px}
#tip .soonline{display:block;margin-top:5px;color:#5a6472;font-size:12px}

#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.dialog{width:min(480px,100%);background:#2f3743;border:1px solid #5a6577;border-radius:6px;padding:16px 18px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.dialog.tw{border-top:3px solid var(--warn)}
.dialog h3{margin:0 0 8px;font-size:16px}
.dialog .ok{color:#9fe6bd}
.dialog .sheets{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.dialog .sheets span{font:12px var(--mono);background:#3a4250;border:1px solid #5a6577;border-radius:3px;padding:0 6px}
.dialog .sheets span.here{border-color:var(--blue);color:#fff}
.dialog .core{font-size:12px;color:#ffd28a;margin-top:8px}
.dialog-acts{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:14px}
#stage.past{background:#29251f}

/* build 6: a change set drawn before it lands */
body{-webkit-touch-callout:none}
#app,#proto{-webkit-user-select:none;user-select:none}
input,textarea,pre{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#proto .seg.tries button{padding:1px 7px}
#proto .acad[aria-pressed=true]{background:#5a1d1d;border-color:#ff8a8a;color:#ffd0d0}
.vd{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font:700 10px/1 var(--ui);font-style:normal;flex:none;color:#10151b}
.vd.ok{background:var(--ok)}.vd.warn{background:var(--warn)}.vd.bad{background:var(--bad);color:#fff}.vd.held{background:#6b7584;color:#fff}
.tab .vd{width:14px;height:14px;font-size:9px}
.tab.pvoff{opacity:.38;cursor:default}
.tab.pvoff:hover{color:var(--dim)}
.pvchip{font:700 11px var(--ui);letter-spacing:.05em;text-transform:uppercase;color:#1c1405;background:var(--warn);border-radius:3px;padding:1px 6px;flex:none}
.prop .pvchip{background:#b48cff;color:#170d2a}
.pvline{display:flex;gap:7px;align-items:flex-start;font:13px/1.4 var(--ui)}
.pvline .vd{margin-top:1px}
.pvsum{font:12px/1.4 var(--ui);padding:4px 8px;border-radius:3px;margin:0}
.pvsum.ok{background:#173a28;border:1px solid #2c6a46;color:#c4f2d8}
.pvsum.warn{background:rgba(74,54,18,.9);border:1px solid #8a6218;color:#ffe2b0}
.pvsum.bad{background:#3a2020;border:1px solid #8a3434;color:#ffc4c4}
.pvcs summary{cursor:pointer;color:var(--dim);font-size:12px;margin-top:8px}
/* B: the band over the command bar */
#pvband{margin:0 0 4px;padding:7px 10px 8px;background:rgba(40,46,56,.98);border:1px solid #c98a1c;border-top:3px solid var(--warn);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.5);font:13px var(--ui);display:grid;gap:6px}
#pvband.prop{border-color:#8c6bd6;border-top-color:#b48cff}
.pvtop{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.pvtitle{min-width:0;color:var(--dim)}.pvtitle b{color:#fff}
.pvnav{display:flex;align-items:center;gap:4px;font-family:var(--mono)}
.pvnav button,.pvnav2 button:not(.pvcur),.pvarrow{background:#3a4250;border:1px solid #5a6577;border-radius:3px;min-width:28px;height:26px;font-size:12px;line-height:1;color:#fff}
.pvnav small{color:var(--dim)}
.pvacts{display:flex;gap:6px;margin-left:auto}
/* A: the dialog's small drawing */
.dialog.pvd{width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto}
.dialog.prop{border-top-color:#b48cff}
.pvsheets button{display:flex;align-items:center;gap:5px;font:12px var(--mono);background:#3a4250;border:1px solid #5a6577;border-radius:3px;padding:2px 7px 2px 4px}
.pvsheets button.here{border-color:#3d6c9e}
.pvsheets button.on{background:#274b76;border-color:var(--blue);color:#fff}
.pvmini{position:relative;height:240px;margin:6px 0 8px;border:1px solid #4b5464;border-radius:4px;overflow:hidden;background:#212830}
.pvmini canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:zoom-in;touch-action:manipulation}
.pvarrow{position:absolute;top:50%;transform:translateY(-50%);height:40px;min-width:32px;opacity:.92}
.pvarrow.l{left:6px}.pvarrow.r{right:6px}
.pvlabel{position:absolute;left:8px;top:6px;font:12px var(--mono);color:var(--dim);background:rgba(20,24,30,.85);padding:1px 6px;border-radius:3px;pointer-events:none}
.pvlabel b{color:#fff}
.pvwhole{position:absolute;right:6px;top:6px;background:rgba(20,24,30,.85);border:1px solid #5a6577;border-radius:3px;font-size:12px;padding:1px 8px}
.dialog.pvd .pvsum{margin-top:8px}
/* C: the panel's card, and the phone's peek */
.pvcard{border:1px solid #c98a1c;border-top:3px solid var(--warn);border-radius:4px;background:#303845;padding:8px 10px 10px;margin:0 0 10px;display:grid;gap:4px}
.pvcard.prop{border-color:#8c6bd6;border-top-color:#b48cff}
.pvhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pvlist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.pvrow{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;align-items:start;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:3px;padding:5px 6px}
.pvrow:hover{background:#3a4352}
.pvrow.on{background:#274b76;border-color:var(--blue)}
.pvrow b{font:12px var(--mono);color:#fff}
.pvrow .pvw{display:block;font-size:12px;color:var(--dim)}
.pvrow.warn .pvw{color:#ffd28a}.pvrow.bad .pvw{color:#ffb0b0}
.pvrow small{display:block;font-size:11px;color:#c8d0da;line-height:1.35;margin-top:1px}
.pvrow small.here{display:inline;color:var(--dim)}
.pvhd{display:flex;align-items:center;gap:8px;min-width:0}
#peek>*{min-width:0}
.pvacts2{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.pvnav2{display:flex;gap:6px;align-items:stretch}
.pvcur{flex:1;display:flex;gap:6px;align-items:center;min-width:0;background:#303845;border:1px solid #4b5464;border-radius:4px;padding:6px 8px;text-align:left;font-size:13px}
.pvcur span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvcur b{font-family:var(--mono)}

/* a phone */
@media (max-width:860px){
  #proto{gap:6px;flex-wrap:nowrap}
  #proto .ttl{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  #swbtn{display:block}
  #switches{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:8px;background:#000;padding:8px;border-bottom:2px solid #ffd84a}
  #proto.open #switches{display:flex}
  .choice{justify-content:space-between;white-space:normal}
  #proto .seg button{padding:5px 8px}
  #title{height:44px;gap:6px}
  #title .name,#title .file,#undo,#accept{display:none}
  #toolsbtn{display:flex;border-color:var(--edge);background:#2a323e}
  body.tools-open #toolsbtn{background:#274b76;border-color:var(--blue)}
  .pills{flex:1;justify-content:flex-end}
  #ribbon{display:none;position:absolute;left:0;right:0;top:44px;z-index:25;flex-wrap:wrap;padding:4px;gap:4px 0;box-shadow:0 14px 30px rgba(0,0,0,.55);border-bottom:2px solid var(--blue)}
  body.tools-open #ribbon{display:flex}
  .panel{border-right:0;flex:1 1 100%}
  .panel .row{flex-wrap:wrap}
  .panel.foldonly{display:flex}
  .rb{min-width:56px;padding:6px 4px 4px}
  .layerbox{min-width:0;flex:1}
  .layerbox select{padding:8px 6px 8px 0;font-size:15px}
  .tab{padding:6px 12px}
  #work{grid-template-columns:minmax(0,1fr)}
  #side{position:absolute;left:0;right:0;bottom:0;top:0;z-index:12;border-left:0;border-top:1px solid #5a6577;border-radius:12px 12px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
  #grab{display:block;padding:7px 0 3px;touch-action:none;cursor:grab}
  #grab span{display:block;margin:0 auto;width:40px;height:4px;border-radius:2px;background:#6a7689}
  #peek{display:grid;gap:6px;padding:2px 10px 8px;touch-action:none}
  .peekline{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  .peeklast{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:center;text-align:left;background:#303845;border:1px solid #3c4553;border-radius:4px;padding:6px}
  .peeklast .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .peekacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .peekacts .btn{padding:8px 10px}
  #status{display:none}
  #zoom{top:auto;transform:none;bottom:calc(var(--peek) + 8px);right:8px}
  #zoom .zi{display:none}
  #zoom .fit{height:36px;width:44px}
  #cmd{bottom:calc(var(--peek) + 8px);width:calc(100% - 68px);left:8px;transform:none}
  #cmdbar{min-height:38px;flex-wrap:wrap;padding:5px 8px}
  #cmdline{white-space:normal;overflow:visible;flex:1 1 100%}
  #cmdbar .chev{display:none}
  #cmdin{flex:1 1 100%;font-size:16px;padding:6px 4px;background:#1b2129;border:1px solid #5a6577;border-radius:3px}
  #kbd{display:inline-block;background:#2b3a50;border:1px solid #4f6684;border-radius:12px;color:#cfe3ff;padding:3px 9px;font:13px var(--ui);margin:2px 2px}
  .opt{display:inline-block;background:#2b3a50;border:1px solid #4f6684;border-radius:12px;color:#cfe3ff;text-decoration:none;padding:3px 10px;margin:2px 2px;font:13px var(--ui)}
  .opt.main{background:#1f6fc9;border-color:#3d8fe8;color:#fff;font-weight:600}
  .brk{display:none}
  #cmdnote{display:none}
  #hist{display:none}
  #cmdwarn{font-size:12px}
  #qp{left:8px!important;right:8px;top:auto!important;bottom:calc(var(--peek) + var(--cmdh,44px) + 16px);width:auto;max-height:44%}
  /* while a field has the keyboard, the card goes to the top of the drawing, clear of it */
  body.qp-editing #qp{top:8px!important;bottom:auto;max-height:52%}
  .prow.ed{grid-template-columns:96px minmax(0,1fr)}
  .prow.ed input,.prow.ed select,.prow.ed textarea,#ined input,#ined textarea,.eav input{font-size:16px}
  .prow.ed input,.prow.ed select{padding:6px 8px}
  #qp .acts .btn.sm{padding:6px 12px;font-size:13px}
  #ined{left:8px!important;right:8px;width:auto!important}
  .eatt-list .eh,.eatt-list .er{grid-template-columns:90px minmax(0,1fr);}
  .eatt-list .eh span:nth-child(2),.eatt-list .er span:nth-child(2){display:none}
  .eatt-list .er{padding:9px 8px}
  .dialog.eatt{align-self:start;margin-top:8px}
  #toast{left:8px;right:8px;max-width:none}
  pre.cs{max-height:120px}
  #tbox{left:8px!important;right:8px;width:auto;top:auto!important;bottom:calc(var(--peek) + 64px)}
  #cmd #arr{position:static;width:auto;margin:0 0 4px;padding:7px 9px}
  #arr input{font-size:16px;padding:4px 7px}
  #arr .grid2{gap:4px 8px}
  #arr label small{display:none}
  #arr .akinds button,#arr .aseg button{padding:6px 10px;font-size:13px}
  #arr .foot .btn{padding:7px 12px}
  #hedit input{font-size:16px}
  #osmenu{left:8px!important;right:8px;width:auto;top:auto!important;bottom:8px}
  .osrow{padding:7px 12px}
  #proto .seg.tries{flex-direction:column}
  #proto .seg.tries button+button{border-left:0;border-top:1px solid #806c25}
  #proto .seg.tries button{text-align:left;padding:7px 8px}
  #proto .acad{padding:6px 8px;width:100%}
  .choice:has(.tries){align-items:flex-start}
  /* B on a phone: the band takes the command bar's place */
  body.pv-band #cmdbar{display:none}
  #pvband{padding:7px 8px 8px;gap:6px;display:flex;flex-direction:column}
  .pvtop{display:contents}
  .pvhd{order:1}.pvnav{order:2}#pvband .pvline{order:3}#pvband .pvsum{order:4}.pvacts{order:5}
  .pvtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pvnav{justify-content:space-between}
  .pvnav button{min-width:44px;height:34px;font-size:14px}
  .pvacts{margin:0;flex-wrap:wrap}
  .pvacts .btn[data-pv=go]{flex-basis:100%}
  .pvacts .btn[data-pv=go]:not(:disabled){flex-basis:auto}
  #modal{padding-top:36px}
  .pvacts .btn{flex:1;padding:8px 10px}
  .pvline{font-size:12px}
  .pvsum{font-size:11px}
  /* A on a phone */
  .dialog.pvd{padding:12px 12px 14px;align-self:start}
  .dialog.pvd p{font-size:12px;margin:0 0 4px}
  .pvmini{height:190px}
  .pvsheets button{padding:5px 8px 5px 5px}
  .dialog.pvd .dialog-acts .btn{flex:1;padding:9px 10px}
  /* C on a phone: the peek holds it */
  .pvcard.compact{border:0;border-top:3px solid var(--warn);border-radius:6px;margin:0;padding:6px 2px 2px;background:none}
  .pvcard.compact.prop{border-top-color:#b48cff}
  .pvcard.compact .pvtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .pvcard.compact .pvhead{flex-wrap:nowrap}
  .pvnav2 button:not(.pvcur){min-width:44px;height:auto;font-size:14px}
  .pvacts2 .btn{flex:1;padding:8px 10px}
  .pvrow{padding:8px 6px}
}

/* build 7: proposals */
#proto .jchoice{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;border:1px dashed #ffd84a;border-radius:4px;padding:3px 8px;white-space:normal;max-width:760px}
#proto .jlabel{font-weight:700;color:#000;background:#ffd84a;border-radius:3px;padding:0 6px}
#proto .jline{flex-basis:100%;color:#ffe9a0;line-height:1.3}
#proto .jline b{font-weight:600}
#proto .jrec{color:#fff}
.b-wait{border-color:#8c6bd6;color:#d9ccff;border-style:dashed}
.je-wait,.je-proposed{}
.jrestore{padding:0 8px 6px 36px}
.stab .pcount{font:700 11px/1 var(--ui);padding:2px 6px;border-radius:8px;background:#b48cff;color:#170d2a}
.stab .pcount.wait{background:none;border:1px dashed #8c6bd6;color:#d9ccff;font-weight:600}
.pnote{margin:0 0 10px;color:var(--dim);font-size:12px;line-height:1.4}
.pempty{border:1px dashed #4f5a6a;border-radius:6px;padding:14px 10px;color:#8f99a6;text-align:center}

function room(){return $('work').clientHeight}
function peekH(){const pk=$('peek');if(phone()&&!pk.hidden&&pk.offsetHeight)S.peekPx=$('grab').offsetHeight+pk.offsetHeight;return S.peekPx||170}
function snapY(n){return n==='peek'?room()-peekH():n==='half'?Math.round(room()*.45):Math.round(room()*.06)}
function placeSheet(animate,top){
  const el=$('side');
  if(!phone()){el.style.top='';el.style.transition='';document.documentElement.style.setProperty('--peek','0px');return}
  const y=top??snapY(S.snap);el.style.transition=animate?'top .28s cubic-bezier(.2,.8,.2,1)':'none';el.style.top=y+'px';
  const p=peekH();if(Math.abs(S_peek()-p)>.5){document.documentElement.style.setProperty('--peek',p+'px');if(!touched)fit()}}

function setSnap(n){S.snap=n;peek();placeSheet(true);fillQp();if(!touched&&phone())fit();draw()}

  el.addEventListener('pointermove',e=>{if(!d)return;const now=performance.now();d.v=(e.clientY-d.last)/Math.max(1,now-d.t);d.t=now;d.last=e.clientY;
    if(Math.abs(e.clientY-d.y0)>6)d.moved=true;d.y=Math.max(snapY('full'),Math.min(snapY('peek'),d.s0+e.clientY-d.y0));placeSheet(false,d.y)});

    if(!x.moved){if(x.tap){setSnap(S.snap==='peek'?'half':'peek');refresh()}return}
    const order=['full','half','peek'];let best=order.reduce((b,n)=>Math.abs(snapY(n)-x.y)<Math.abs(snapY(b)-x.y)?n:b,'peek');
    if(Math.abs(x.v)>.5)best=order[Math.max(0,Math.min(2,order.indexOf(S.snap)+(x.v>0?1:-1)))];setSnap(best);refresh()};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
